<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1050" viewBox="0 0 520 1050" role="img" aria-labelledby="title desc">
<title id="title">凍結ViT的patch features，接單物件分類與框head</title><desc id="desc">完整32乘32原圖送入凍結teacherViT。16個32維patch features按列還原為32channel的4乘4grid；train統計標準化後攤平512維，用64維共用層輸出紅藍兩個logits和四個框raw值。只有這個新head接受有標籤的訓練。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536476" stroke-width="1.5"/></marker></defs>
<rect width="520" height="1050" rx="16" fill="#f7f9fc"/>
<g font-family="sans-serif" font-size="24" fill="#152c43">
<text x="24" y="38" font-size="27" font-weight="700">從 patch 特徵到一個框</text><text x="24" y="76">shape 與排列示意；不是特徵數值</text>
<rect x="45" y="108" width="430" height="63" rx="10" fill="#e8eef7"/><text x="83" y="148">完整 RGB 圖 [B,3,32,32]</text>
<path d="M260 171V202" stroke="#536476" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="213" width="430" height="83" rx="10" fill="#e8f4f0" stroke="#238263" stroke-width="2"/><text x="92" y="247" font-weight="700">凍結 teacher 的 ViT</text><text x="98" y="280">patches [B,16,32]</text>
<path d="M260 296V328" stroke="#536476" stroke-width="3" marker-end="url(#arrow)"/>
<g fill="#e9effb" stroke="#6984a7" stroke-width="1.5"><rect x="36" y="345" width="192" height="192"/><path d="M84 345V537M132 345V537M180 345V537M36 393H228M36 441H228M36 489H228"/></g>
<g font-size="22" text-anchor="middle"><text x="60" y="377">1</text><text x="108" y="377">2</text><text x="156" y="377">3</text><text x="204" y="377">4</text><text x="60" y="425">5</text><text x="108" y="425">6</text><text x="156" y="425">7</text><text x="204" y="425">8</text><text x="60" y="473">9</text><text x="108" y="473">10</text><text x="156" y="473">11</text><text x="204" y="473">12</text><text x="60" y="521">13</text><text x="108" y="521">14</text><text x="156" y="521">15</text><text x="204" y="521">16</text></g>
<text x="257" y="383">交換軸，再還原</text><text x="270" y="429">[B,32,4,4]</text><text x="259" y="475">每格 32 個特徵</text><text x="259" y="521">編號仍按原圖排列</text>
<path d="M260 548V580" stroke="#536476" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="591" width="430" height="87" rx="10" fill="#e9effb" stroke="#4672b1" stroke-width="2"/><text x="70" y="625">用 train 統計標準化，再攤平</text><text x="87" y="661">512 → Linear / GELU → 64</text>
<path d="M260 678V708H140V729M260 708H385V729" stroke="#536476" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="28" y="740" width="222" height="100" rx="10" fill="#fff7db"/><rect x="274" y="740" width="222" height="100" rx="10" fill="#fff7db"/>
<text x="55" y="776">Linear(64,2)</text><text x="55" y="816">紅／藍 logits</text><text x="299" y="776">Linear(64,4)</text><text x="303" y="816">四個框 raw 值</text>
<text x="42" y="885" font-weight="700">只更新新 head；不改 ViT 特徵</text>
<rect x="28" y="920" width="468" height="89" rx="10" fill="#fff0e3" stroke="#bc6324" stroke-width="2"/><text x="56" y="955">train 顏色 label + normalized box</text><text x="66" y="992">交叉熵 + 10 × Smooth L1</text>
</g></svg>
