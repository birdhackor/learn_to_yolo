<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="title desc"><title id="title">投影捷徑：兩路變成相同形狀</title><desc id="desc">主分支與捷徑從同一輸入分開，到加號逐值相加。投影捷徑使用1乘1步幅2卷積，將3通道4乘4變成6通道2乘2。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52647b"/></marker></defs>
<rect width="560" height="620" rx="14" fill="#f8fafc"/>
<text x="280" y="38" font-family="Noto Sans CJK TC, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#172b46">投影捷徑：兩路變成相同形狀</text>
<rect x="147" y="65" width="266" height="64" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="280" y="93" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">輸入 x</text>
<text x="280" y="118" font-family="Noto Sans CJK TC, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#172b46">[N,3,4,4]</text>
<path d="M280 130 L280 152" fill="none" stroke="#52647b" stroke-width="2.5"/>
<path d="M280 152 L152 152" fill="none" stroke="#52647b" stroke-width="2.5"/>
<path d="M280 152 L430 152" fill="none" stroke="#52647b" stroke-width="2.5"/>
<path d="M152 152 L152 180" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M430 152 L430 275" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="85" y="170" font-family="Noto Sans CJK TC, sans-serif" font-size="20" text-anchor="middle" font-weight="normal" fill="#172b46">主分支 F</text>
<text x="365" y="170" font-family="Noto Sans CJK TC, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#172b46">捷徑 P</text>
<rect x="36" y="184" width="232" height="62" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="152" y="223" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">3×3，步幅 2</text>
<rect x="36" y="282" width="232" height="62" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="152" y="321" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">ReLU</text>
<rect x="36" y="380" width="232" height="62" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="152" y="419" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">3×3 卷積</text>
<path d="M152 248 L152 278" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M152 346 L152 376" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="316" y="284" width="225" height="88" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/>
<text x="428" y="319" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">1×1，步幅 2</text>
<text x="428" y="353" font-family="Noto Sans CJK TC, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b46">3 通道 → 6 通道</text>
<path d="M430 373 L430 484" fill="none" stroke="#52647b" stroke-width="2.5"/>
<path d="M152 444 L152 484" fill="none" stroke="#52647b" stroke-width="2.5"/>
<path d="M152 484 L262 484" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M430 484 L298 484" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="262" y="467" width="36" height="36" rx="18" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="280" y="494" font-family="Noto Sans CJK TC, sans-serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#172b46">+</text>
<text x="280" y="527" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">兩路各軸相同，逐值相加</text>
<path d="M280 533 L280 552" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="106" y="554" width="348" height="52" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="280" y="587" font-family="Noto Sans CJK TC, sans-serif" font-size="22" text-anchor="middle" font-weight="normal" fill="#172b46">y：[N,6,2,2]</text>
</svg>
