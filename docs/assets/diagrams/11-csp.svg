<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">CSP 把部分 channel 留走短路徑，最後再拼接</title><desc id="desc">上方8channel全部經兩個3乘3卷積；下方拆成4加4，其中4直接走到concat，另一半經兩個卷積，拼回8後以1乘1融合。Concat沿channel擴充，不是逐值相加。</desc>
<style>text{font-family:system-ui,sans-serif;font-size:17px;fill:#172554}.box{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="900" height="350" fill="white" rx="12"/>
<text x="24" y="32" font-weight="bold">相同輸入與輸出 shape，路徑不同</text>
<text x="24" y="88">Full</text><rect class="box" x="105" y="59" width="115" height="55" rx="8"/><text x="122" y="83">輸入 C=8</text><text x="122" y="105">H×W不變</text>
<path class="line" d="M220 87H255"/><rect class="box" x="264" y="59" width="146" height="55" rx="8"/><text x="282" y="92">3×3：8→8</text><path class="line" d="M410 87H445"/>
<rect class="box" x="454" y="59" width="146" height="55" rx="8"/><text x="471" y="92">3×3：8→8</text><path class="line" d="M600 87H632"/>
<rect class="box" x="640" y="59" width="226" height="55" rx="8"/><text x="661" y="92">1×1融合：8→8</text>
<text x="24" y="240">CSP</text><rect class="box" x="105" y="208" width="115" height="55" rx="8"/><text x="122" y="232">輸入 C=8</text><text x="122" y="254">split：4+4</text>
<path class="line" d="M220 224H238V169H624V224H642"/><text x="318" y="160">直接路徑：4 channels</text>
<path class="line" d="M220 248H252"/><rect class="box" x="260" y="216" width="137" height="55" rx="8"/><text x="274" y="249">3×3：4→4</text>
<path class="line" d="M397 244H422"/><rect class="box" x="430" y="216" width="137" height="55" rx="8"/><text x="444" y="249">3×3：4→4</text>
<path class="line" d="M567 244H642"/><rect class="box" x="650" y="208" width="216" height="63" rx="8"/><text x="666" y="233">concat：4+4=8</text><text x="666" y="256">1×1融合：8→8</text>
<text x="24" y="315">本章簡化：卷積帶 bias。參數 1240 → 368；H、W 相同，尚未比較真實辨識效果。</text>
<text x="24" y="340">concat 沿 channel 拼接；add 則要求兩支形狀相同並逐值相加。</text>
</svg>
