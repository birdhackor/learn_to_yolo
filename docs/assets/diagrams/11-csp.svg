<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1750" viewBox="0 0 480 1750" role="img" aria-labelledby="title desc">
<title id="title">Full 與 CSP：channel 的完整路徑與參數數量</title>
<desc id="desc">上下兩個block的輸入、輸出均為[B,8,8,8]，每一步H×W不變。Full是C=8經兩個3×3卷積各接ReLU，再經1×1融合，都是8到8。CSP沿channel把C=8切成前4與後4。左支是前4旁路，不經3×3；右支是後4，經兩個4到4的3×3卷積各接ReLU。兩支在concat沿channel串接為4+4=8，再經8到8的1×1融合。方框大小不表示參數量。卷積帶bias；Full參數2×(8×8×9+8)+(8×8+8)=1240，CSP參數2×(4×4×9+4)+(8×8+8)=368。這是本節無BatchNorm、使用ReLU的簡化；不比較準確度。concat為串接；add要求兩支形狀相同並逐值相加。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker></defs>
<rect width="480" height="1750" fill="#f8fafc"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a">
<text x="28" y="38" font-size="26" fill="#0f172a" font-weight="700">H×W 不變，channel 路徑不同</text>
<text x="28" y="74" font-size="24" fill="#0f172a">輸入／輸出：[B,8,8,8]</text>
<rect x="12" y="96" width="456" height="594" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="134" font-size="24" fill="#0f172a" font-weight="700">① Full：全部 8 個 channel</text>
<rect x="90" y="156" width="300" height="58" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="240" y="193" font-size="24" fill="#0f172a" text-anchor="middle">輸入 C=8</text>
<rect x="90" y="250" width="300" height="70" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="240" y="278" font-size="24" fill="#0f172a" text-anchor="middle">3×3 → ReLU</text>
<text x="240" y="308" font-size="24" fill="#0f172a" text-anchor="middle">8 → 8</text>
<rect x="90" y="350" width="300" height="70" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="240" y="378" font-size="24" fill="#0f172a" text-anchor="middle">3×3 → ReLU</text>
<text x="240" y="408" font-size="24" fill="#0f172a" text-anchor="middle">8 → 8</text>
<rect x="90" y="450" width="300" height="70" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="240" y="493" font-size="24" fill="#0f172a" text-anchor="middle">1×1 融合：8 → 8</text>
<path d="M240 214L240 242" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M240 320L240 342" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M240 420L240 442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="562" font-size="24" fill="#0f172a">兩個 3×3：</text>
<text x="28" y="596" font-size="24" fill="#0f172a">2×(8×8×9+8)=1168</text>
<text x="28" y="630" font-size="24" fill="#0f172a">1×1：8×8+8=72</text>
<text x="28" y="668" font-size="24" fill="#0f172a" font-weight="700">Full 合計：1168+72=1240</text>
<rect x="12" y="706" width="456" height="828" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="744" font-size="24" fill="#0f172a" font-weight="700">② CSP：分支後串接，再融合</text>
<rect x="108" y="768" width="264" height="70" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="240" y="796" font-size="24" fill="#0f172a" text-anchor="middle">輸入 C=8</text>
<text x="240" y="826" font-size="24" fill="#0f172a" text-anchor="middle">沿 channel 切成 4+4</text>
<path d="M190 838V858H130V894" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M290 838V858H350V894" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="46" y="908" width="168" height="218" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="130" y="995" font-size="24" fill="#0f172a" text-anchor="middle">前 4：旁路</text>
<text x="130" y="1025" font-size="24" fill="#0f172a" text-anchor="middle">不經 3×3</text>
<text x="130" y="1055" font-size="24" fill="#0f172a" text-anchor="middle">保留 C=4</text>
<rect x="266" y="908" width="168" height="98" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="350" y="935" font-size="24" fill="#0f172a" text-anchor="middle">後 4：卷積</text>
<text x="350" y="965" font-size="24" fill="#0f172a" text-anchor="middle">3×3 → ReLU</text>
<text x="350" y="995" font-size="24" fill="#0f172a" text-anchor="middle">4 → 4</text>
<rect x="266" y="1046" width="168" height="80" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="350" y="1079" font-size="24" fill="#0f172a" text-anchor="middle">3×3 → ReLU</text>
<text x="350" y="1109" font-size="24" fill="#0f172a" text-anchor="middle">4 → 4</text>
<path d="M350 1006L350 1038" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M130 1126V1164H190V1184" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 1126V1164H290V1184" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1192" width="400" height="70" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="240" y="1220" font-size="24" fill="#0f172a" text-anchor="middle">concat：沿 channel 串接</text>
<text x="240" y="1250" font-size="24" fill="#0f172a" text-anchor="middle">4+4=8</text>
<path d="M240 1262L240 1286" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="108" y="1294" width="264" height="62" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" rx="8" />
<text x="240" y="1333" font-size="24" fill="#0f172a" text-anchor="middle">1×1 融合：8 → 8</text>
<text x="28" y="1400" font-size="24" fill="#0f172a">兩個 3×3：2×(4×4×9+4)=296</text>
<text x="28" y="1438" font-size="24" fill="#0f172a">1×1：8×8+8=72</text>
<text x="28" y="1482" font-size="24" fill="#0f172a" font-weight="700">CSP 合計：296+72=368</text>
<text x="28" y="1574" font-size="22" fill="#0f172a">本節簡化：無 BatchNorm、用 ReLU；</text>
<text x="28" y="1608" font-size="24" fill="#0f172a">卷積帶 bias。參數 1240 → 368。</text>
<text x="28" y="1642" font-size="22" fill="#0f172a">方框大小不表示參數；不比較準確度。</text>
<text x="28" y="1680" font-size="24" fill="#0f172a">concat：沿 channel 串接。</text>
<text x="28" y="1716" font-size="24" fill="#0f172a">add：兩支形狀相同，逐值相加。</text>
</g></svg>
