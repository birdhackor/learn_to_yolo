<svg xmlns="http://www.w3.org/2000/svg" width="480" height="694" viewBox="0 0 480 694" role="img" aria-labelledby="title desc">
<title id="title">每個槽位的內容加位置向量</title><desc id="desc">手工流程示意，沒有展示實測向量數值。每份內容與位置都有32個特徵，逐值相加後仍32維。CLS是第0槽。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172554;font-size:24px} .small{font-size:22px}.head{font-size:28px;font-weight:700}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)} image{image-rendering:pixelated}</style>
<rect width="480" height="694" rx="12" fill="#f8fafc"/>
<text x="240" y="42" text-anchor="middle" style="font-size:28px">每個槽：內容＋位置</text>
<rect x="20" y="86" width="180" height="70" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="110.0" y="113.0" text-anchor="middle" style="font-size:24px">CLS 初值</text>
<text x="110.0" y="145.0" text-anchor="middle" style="font-size:24px">32 維</text>
<text x="240" y="129" text-anchor="middle" style="font-size:28px">＋</text>
<rect x="280" y="86" width="180" height="70" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="370.0" y="113.0" text-anchor="middle" style="font-size:24px">位置 0</text>
<text x="370.0" y="145.0" text-anchor="middle" style="font-size:24px">32 維</text>
<path d="M240 164V188" class="line"/>
<rect x="112" y="198" width="256" height="48" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="230.0" text-anchor="middle" style="font-size:24px">token 0：CLS</text>
<rect x="20" y="270" width="180" height="70" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="110.0" y="297.0" text-anchor="middle" style="font-size:24px">patch 1 內容</text>
<text x="110.0" y="329.0" text-anchor="middle" style="font-size:24px">32 維</text>
<text x="240" y="313" text-anchor="middle" style="font-size:28px">＋</text>
<rect x="280" y="270" width="180" height="70" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="370.0" y="297.0" text-anchor="middle" style="font-size:24px">位置 1</text>
<text x="370.0" y="329.0" text-anchor="middle" style="font-size:24px">32 維</text>
<path d="M240 348V372" class="line"/>
<rect x="112" y="382" width="256" height="48" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="414.0" text-anchor="middle" style="font-size:24px">token 1</text>
<rect x="20" y="454" width="180" height="70" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="110.0" y="481.0" text-anchor="middle" style="font-size:24px">patch 16 內容</text>
<text x="110.0" y="513.0" text-anchor="middle" style="font-size:24px">32 維</text>
<text x="240" y="497" text-anchor="middle" style="font-size:28px">＋</text>
<rect x="280" y="454" width="180" height="70" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="370.0" y="481.0" text-anchor="middle" style="font-size:24px">位置 16</text>
<text x="370.0" y="513.0" text-anchor="middle" style="font-size:24px">32 維</text>
<path d="M240 532V556" class="line"/>
<rect x="112" y="566" width="256" height="48" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="598.0" text-anchor="middle" style="font-size:24px">token 16</text>
<text x="240" y="652" text-anchor="middle" style="font-size:26px">全部合成 [B,17,32]</text>
<text x="240" y="682" text-anchor="middle" style="font-size:22px">手工示意 · 加法保持特徵數</text>
</svg>
