<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" aria-labelledby="title desc">
<title id="title">IoU 幾何：真值 G、預測 P、包圍框 C 與中心距離</title>
<desc id="desc">依比例繪製的示意圖：座標單位是畫素，依比例放大 10 倍繪製；框都寫成 xyxy，也就是 [左,上,右,下]。綠框是真值 G＝[8,12,24,28]，中心 (16,20)；藍框是預測 P＝[32,12,48,28]，中心 (40,20)。兩框都是 16×16、面積 256，彼此沒有交集，聯集 union＝512 畫素²。虛線框是能同時框住兩框的最小包圍框 C＝[8,12,48,28]，寬 40、高 16，area(C)＝640 畫素²。兩框中間寬 8、高 16 的淡黃色區域是 C 中的空白：640−512＝128 畫素²。黑色雙箭頭連接兩個中心，標 ρ＝24，是兩中心的距離。紫色斜線是 C 的對角線 c，框外的紫色底色標籤寫 c²＝40²＋16²＝1856；ρ²/c²＝576/1856，沒有單位。圖下註明：P 左移 1 畫素時，C 的面積降到 624，GIoU loss 從 1.2 降到 1.179487。</desc>
<!-- 依比例：畫素座標 (x,y) 對應圖面 (10x−40, 10y−10)；1 畫素畫成 10 個單位。 -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="720" height="548" fill="#f8fafc"/>
<rect id="blank" x="200" y="110" width="80" height="160" fill="#fef3c7"/>
<rect id="gt-box" x="40" y="110" width="160" height="160" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<rect id="pred-box" x="280" y="110" width="160" height="160" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<rect id="enclosing-box" x="40" y="110" width="400" height="160" fill="none" stroke="#b45309" stroke-width="4" stroke-dasharray="10 7"/>
<path id="diagonal" d="M40 110L440 270" stroke="#7c3aed" stroke-width="2"/>
<path id="blank-leader" d="M240 236V290" stroke="#b45309" stroke-width="1.5"/>
<path d="M127 190H353" stroke="#172033" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle cx="120" cy="190" r="5" fill="#172033"/><circle cx="360" cy="190" r="5" fill="#172033"/>
<rect id="c-label-bg" x="452" y="216" width="248" height="68" rx="6" fill="#ede9fe"/>
<g font-family="sans-serif" font-size="20" fill="#172033">
<text x="40" y="40" font-size="24">未相交也有移動方向：C 隨 P 往左而縮小</text>
<text x="40" y="94" fill="#15803d">G 真值</text><text x="280" y="94" fill="#1d4ed8">P 預測</text>
<text x="460" y="131" fill="#b45309">C：40×16，最小包圍框</text>
<text x="240" y="159" text-anchor="middle">ρ = 24</text>
<g text-anchor="middle" fill="#6d28d9"><text x="576" y="242">c：C 的對角線，</text><text x="576" y="272">c² = 40²＋16² = 1856</text></g>
<text x="240" y="316" text-anchor="middle" fill="#b45309">C 中的空白 = 640 − 512 = 128 畫素²</text>
<text x="40" y="368" fill="#15803d">G = [8,12,24,28]</text><text x="380" y="368">union = 512 畫素²</text>
<text x="40" y="402" fill="#1d4ed8">P = [32,12,48,28]</text><text x="380" y="402">area(C) = 640 畫素²</text>
<text x="40" y="436" fill="#b45309">C = [8,12,48,28]</text><text x="380" y="436">ρ²/c² = 576/1856（無單位）</text>
<text x="40" y="488">xyxy = [左,上,右,下]；依比例放大 10 倍繪製；G 與 P 沒有交集。</text>
<text x="40" y="522">P 左移 1 畫素：C 面積降到 624，GIoU loss 1.2 → 1.179487。</text>
</g></svg>
