<svg xmlns="http://www.w3.org/2000/svg" width="400" height="830" viewBox="0 0 400 830" role="img" aria-labelledby="title desc">
<title id="title">IoU 幾何：兩框、包圍框，以及左移一步的 GIoU loss</title>
<desc id="desc">框都寫成 xyxy，單位 pixel。綠框 G=[8,12,24,28]，中心 (16,20)；藍框 P=[32,12,48,28]，中心 (40,20)。兩框都是 16×16，沒有交集，union=512 pixel²。橘色虛線是最小包圍框 C=[8,12,48,28]，寬 40、高 16，面積 640；中間黃色空白寬 8、高 16，面積 128。黑色線連接兩中心，ρ=24；紫色線是 C 對角線，c²=40²+16²=1856。幾何依比例放大 8 倍繪製。下方獨立大字卡分行呈現：P 左移 1 pixel 後，C 面積 624、空白 112、union 512；GIoU loss 從 1.2 降至 1.179487，仍無交集。</desc>
<!-- 依比例：(x,y) 對應圖面 (8x−24, 8y+18)。 -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#172033"/></marker></defs>
<rect width="400" height="830" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#172033">
<text x="16" y="31" font-size="22">未相交：包圍框仍能提供訊號</text>
<g font-size="20"><text x="40" y="83" fill="#15803d">G 真值</text><text x="232" y="83" fill="#1d4ed8">P 預測</text></g>
<rect x="168" y="114" width="64" height="128" fill="#fef3c7"/>
<rect x="40" y="114" width="128" height="128" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<rect x="232" y="114" width="128" height="128" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<rect x="40" y="114" width="320" height="128" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M40 114L360 242" stroke="#7c3aed" stroke-width="2"/>
<path d="M111 178H289" stroke="#172033" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<circle cx="104" cy="178" r="5" fill="#172033"/><circle cx="296" cy="178" r="5" fill="#172033"/>
<text x="200" y="154" text-anchor="middle" font-size="22">ρ = 24</text>
<g font-size="20"><text x="16" y="282" fill="#b45309">橘虛線 C：40×16，面積 640</text><text x="16" y="315" fill="#b45309">黃色空白：640−512 = 128</text></g>
<rect x="16" y="340" width="368" height="82" rx="8" fill="#ede9fe"/>
<g font-size="21" fill="#6d28d9"><text x="30" y="371">紫線 c：C 的對角線</text><text x="30" y="405">c² = 40²＋16² = 1856</text></g>
<g font-size="20"><text x="16" y="460" fill="#15803d">G = [8,12,24,28]</text><text x="16" y="493" fill="#1d4ed8">P = [32,12,48,28]</text><text x="16" y="526" fill="#b45309">C = [8,12,48,28]</text><text x="16" y="559">union = 512；沒有交集</text><text x="16" y="592">ρ²/c² = 576/1856（無單位）</text></g>
<rect x="16" y="616" width="368" height="150" rx="8" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
<g font-size="22"><text x="30" y="649">P 左移 1 pixel，仍未相交</text><text x="30" y="683">C 面積 624；空白 112</text><text x="30" y="717">GIoU loss：</text><text x="30" y="751" font-weight="bold" fill="#1d4ed8">1.2 → 1.179487</text></g>
<g font-size="19" fill="#475569"><text x="16" y="796">xyxy = [左,上,右,下]；座標用 pixel。</text><text x="16" y="824">幾何等比例繪製；面積單位 pixel²。</text></g>
</g></svg>
