<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" role="img" aria-labelledby="title desc">
<title id="title">小 CNN 的 8 張實際合成訓練圖與答案</title><desc id="desc">按 lesson_cases/01-small-cnn.py 的 make_batch 規則繪製，每個畫素放大3倍。圖0至7皆為32乘32，黑底12乘12方塊，偶數紅色答案0，奇數藍色答案1。位置相同的1與4、3與6，顏色不同。</desc>
<rect width="520" height="720" rx="12" fill="#f8fafc"/>
