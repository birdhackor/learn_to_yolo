<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 508" role="img" aria-labelledby="title description">
  <title id="title">紅框中心決定負責預測的格子</title>
  <desc id="description">示意圖：64乘64圖片切成4乘4格，每格16畫素。紅框左上角是8,12，右下角是24,28，中心黑點是16,20。藍色格子位於第2列、第2欄，程式索引列1欄1。中心在x等於16的分界線時，歸右側格子。框可以跨格，責任由中心決定。圖中框與中心是已知標註，不是模型預測。</desc>
  <style>
    text{font-family:system-ui,sans-serif;fill:#172554;font-size:20px}
    .title{font-weight:700;font-size:22px}
    .axis{fill:#475569;font-size:18px}
    .grid{stroke:#94a3b8;stroke-width:1;fill:none}
  </style>
  <rect width="400" height="508" rx="12" fill="#fff"/>
  <text x="20" y="33" class="title">一個紅框，誰來負責？</text>
  <text x="20" y="65">64×64 圖片，切成 4×4 格</text>

  <!-- 圖片座標 (x,y) 映到 SVG 的 (76+4x,116+4y)。 -->
  <rect x="76" y="116" width="256" height="256" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <rect id="responsible-cell" x="140" y="180" width="64" height="64" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>
  <path class="grid" d="M140 116V372M204 116V372M268 116V372M76 180H332M76 244H332M76 308H332"/>
  <rect id="red-box" x="108" y="164" width="64" height="64" fill="#dc2626" fill-opacity=".12" stroke="#dc2626" stroke-width="3"/>
  <circle id="box-center" cx="140" cy="196" r="4.5" fill="#172554" stroke="#fff" stroke-width="1.5"/>

  <g class="axis" text-anchor="middle">
    <text x="76" y="103">0</text><text x="140" y="103">16</text><text x="204" y="103">32</text><text x="268" y="103">48</text><text x="332" y="103">64</text>
  </g>
  <g class="axis" text-anchor="end" dominant-baseline="middle">
    <text x="62" y="116">0</text><text x="62" y="180">16</text><text x="62" y="244">32</text><text x="62" y="308">48</text><text x="62" y="372">64</text>
  </g>
  <text x="348" y="103" class="axis">x →</text>
  <text x="18" y="230" class="axis">y</text><text x="16" y="256" class="axis">↓</text>

  <rect x="20" y="393" width="14" height="14" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="44" y="407">左上 (8,12)、右下 (24,28)</text>
  <circle cx="27" cy="437" r="4.5" fill="#172554"/>
  <text x="44" y="443">中心 (16,20)</text>
  <rect x="20" y="464" width="14" height="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="44" y="478">負責格：第 2 列、第 2 欄</text>
</svg>
