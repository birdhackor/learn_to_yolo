<svg xmlns="http://www.w3.org/2000/svg" width="400" height="850" viewBox="0 0 400 850" role="img" aria-labelledby="title desc">
<title id="title">crop 32×32、resize 64×64，再建立新 targets</title>
<desc id="desc">人工框的座標示意，兩站圖片等寬呈現，不表示兩圖畫素數相同。第一站是程式裁出的 32×32 圖：紅色可見部分由綠色框 [0,4,8,20] 框住，寬 8、高 16 pixel。第二站是手算的等比例放大，非本節程式的執行結果：圖和框一起乘 2，圖變成 64×64，框變成 [0,8,16,40]，中心 (8,24)。第二站疊上 4×4 targets 網格，每格 16 pixel。中心位於藍色虛線標出的 gx=0、gy=1 格。不能沿用增強前原圖的 gx=1、gy=1 格。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
<rect width="400" height="850" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#172033">
<text x="16" y="30" font-size="22">crop → resize → 新格子</text>
<text x="16" y="68" font-size="20">1. crop 後：32×32（程式輸出）</text>
<rect x="104" y="90" width="192" height="192" fill="#172033"/>
<rect x="104" y="114" width="48" height="96" fill="#ef4444" stroke="#22c55e" stroke-width="3"/>
<g font-size="20"><text x="16" y="316" fill="#15803d">框 [0,4,8,20]，單位 pixel</text><text x="16" y="348">可見部分：寬 8、高 16</text></g>
<path d="M200 365V441" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<text x="217" y="390" font-size="20" fill="#1d4ed8">圖與框一起 ×2</text><text x="217" y="420" font-size="20" fill="#475569">以下是手算</text>
<text x="16" y="474" font-size="20">2. resize 後：64×64</text>
<rect x="104" y="500" width="192" height="192" fill="#172033"/>
<rect x="104" y="524" width="48" height="96" fill="#ef4444" stroke="#22c55e" stroke-width="3"/>
<g stroke="#94a3b8" stroke-width="1"><path d="M152 500V692M200 500V692M248 500V692"/><path d="M104 548H296M104 596H296M104 644H296"/></g>
<rect x="104" y="548" width="48" height="48" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="128" cy="572" r="5" fill="white"/>
<g font-size="18" fill="#475569"><text x="112" y="495">gx=0</text><text x="40" y="578">gy=1</text></g>
<g font-size="20"><text x="16" y="726" fill="#15803d">新框 [0,8,16,40]，單位 pixel</text><text x="16" y="758">新中心 (8,24)，每格 16 pixel</text><text x="16" y="790" fill="#1d4ed8">3. 建立 targets：(gx=0, gy=1)</text><text x="16" y="828" fill="#475569">兩站等寬呈現；座標各用自己的圖。</text></g>
</g></svg>
