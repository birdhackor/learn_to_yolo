<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
 <title id="title">人工真值框和偏移預測框的定位比較</title>
 <desc id="desc">按比例繪製：32×32 圖的每 1 px 畫成 10 個 SVG 單位，圖左上角為 (0,0)，x 向右、y 向下。黑色大方塊是整張 32×32 圖。紅色方塊是圖中的物件，位置與綠色實線 GT 框 xyxy [4,6,16,18] 相同；黃色虛線是人工設定的 pred 框 xyxy [6,8,18,20]，不是模型輸出。兩框重疊的 10×10 交集 xyxy [6,8,16,18] 畫白色斜線並標「交集」。交集 10×10＝100 px²，聯集 144＋144−100＝188 px²，IoU＝100÷188，約 0.532。座標單位是畫素（px），框採半開區間。</desc>
 <defs>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
   <path d="M5 0V10" stroke="#f8fafc" stroke-width="3"/>
  </pattern>
 </defs>
 <rect width="720" height="430" fill="#f8fafc"/>
 <!-- 圖片座標 (x,y) 畫在 SVG 的 (24+10x, 56+10y)，即 1 px＝10 單位。 -->
 <rect x="24" y="56" width="320" height="320" fill="#0f172a"/>
 <rect x="64" y="116" width="120" height="120" fill="#ef4444"/>
 <rect x="84" y="136" width="100" height="100" fill="url(#hatch)"/>
 <rect x="64" y="116" width="120" height="120" fill="none" stroke="#4ade80" stroke-width="4"/>
 <rect x="84" y="136" width="120" height="120" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="9 5"/>
 <rect x="108" y="171" width="52" height="30" rx="4" fill="#f8fafc"/>
 <g fill="#0f172a">
  <rect x="368" y="66" width="28" height="28" rx="3"/>
  <rect x="368" y="138" width="28" height="28" rx="3"/>
  <rect x="368" y="182" width="28" height="28" rx="3"/>
 </g>
 <rect x="373" y="71" width="18" height="18" fill="#ef4444"/>
 <rect x="373.5" y="143.5" width="17" height="17" fill="none" stroke="#4ade80" stroke-width="3"/>
 <rect x="373.5" y="187.5" width="17" height="17" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="5 3"/>
 <g font-family="sans-serif" font-size="20" fill="#0f172a">
  <text x="24" y="40">32×32 圖</text>
  <text x="134" y="194" text-anchor="middle">交集</text>
  <text x="368" y="40">人工固定框，非模型輸出</text>
  <text x="406" y="87">紅色方塊：圖中的物件</text>
  <text x="406" y="117">（位置與綠色 GT 框相同）</text>
  <text x="406" y="159">綠實線：GT xyxy [4,6,16,18]</text>
  <text x="406" y="203">黃虛線：pred xyxy [6,8,18,20]</text>
  <text x="368" y="268">交集：10×10＝100 px²</text>
  <text x="368" y="306">聯集：144＋144−100＝188 px²</text>
  <text x="368" y="344">IoU：100÷188 ≈ 0.532</text>
  <text x="24" y="412">圖左上角為 (0,0)，x 向右、y 向下，單位為 px；框採半開區間。</text>
 </g>
</svg>
