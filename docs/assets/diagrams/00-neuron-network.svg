<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-labelledby="title desc"><title id="title">一個神經元與多層組合</title><desc id="desc">兩個输入各乘權重，加上偏置，經ReLU得到輸出。多個神經元排成一層，輸出接到下一層。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52647b"/></marker></defs>
<rect width="560" height="600" rx="14" fill="#f8fafc"/>
<text x="280" y="38" font-family="Noto Sans CJK TC, sans-serif" font-size="27" text-anchor="middle" font-weight="bold" fill="#172b46">先看一個神經元</text>
<rect x="35" y="67" width="190" height="65" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="130" y="107" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">2 × 0.5 = 1</text>
<rect x="335" y="67" width="190" height="65" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="430" y="107" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">1 × (−1) = −1</text>
<path d="M130 134 L240 174" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M430 134 L320 174" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="120" y="177" width="320" height="65" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="280" y="217" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">1 − 1 + bias 0.5 = 0.5</text>
<path d="M280 244 L280 267" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="135" y="270" width="290" height="66" rx="8" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/>
<text x="280" y="311" font-family="Noto Sans CJK TC, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#172b46">ReLU：max(0, 0.5) = 0.5</text>
<path d="M35 362 L525 362" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
<text x="280" y="402" font-family="Noto Sans CJK TC, sans-serif" font-size="25" text-anchor="middle" font-weight="bold" fill="#172b46">再把多個神經元接成層</text>
<text x="76" y="445" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">輸入</text>
<rect x="48" y="463" width="56" height="44" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/>
<text x="76" y="493" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">x</text>
<rect x="48" y="523" width="56" height="44" rx="8" fill="#dcfce7" stroke="#94a3b8" stroke-width="2"/>
<text x="76" y="553" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">x</text>
<text x="240" y="445" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">第一層</text>
<rect x="212" y="463" width="56" height="44" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="240" y="493" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">a</text>
<rect x="212" y="523" width="56" height="44" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="240" y="553" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">a</text>
<text x="420" y="445" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">下一層</text>
<rect x="392" y="463" width="56" height="44" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="420" y="493" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">a</text>
<rect x="392" y="523" width="56" height="44" rx="8" fill="#e0f2fe" stroke="#94a3b8" stroke-width="2"/>
<text x="420" y="553" font-family="Noto Sans CJK TC, sans-serif" font-size="23" text-anchor="middle" font-weight="normal" fill="#172b46">a</text>
