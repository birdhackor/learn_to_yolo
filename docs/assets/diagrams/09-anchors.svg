<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1180" viewBox="0 0 480 1180" role="img" aria-labelledby="title desc">
<title id="title">同一格的兩個 anchor 槽：positive、ignore 與其餘30個 negative</title>
<desc id="desc">本節自訂的anchor責任規則。64×64圖片，4×4格，每格16畫素、兩個anchor槽。圖片座標轉為SVG座標：(x,y)→(80+5.5x,152+5.5y)。真值框[8,12,24,28]，中心(16,20)，floor後屬格(gx=1,gy=1)，中心x=16在格線上，歸右側第1欄。紅實線是GT；紫色虛線兩個anchor均以真值中心對齊：槽0是16×16，槽1是8×8。槽0尺寸IoU=1為positive；槽1尺寸IoU=0.25，大於本節ignore門檻0.2，所以不計任何loss。其餘15格各2槽，共30個negative。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker></defs>
<rect width="480" height="1180" fill="#f8fafc"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a">
<text x="28" y="38" font-size="26" fill="#0f172a" font-weight="700">兩個 anchor 是兩個槽</text>
<text x="28" y="74" font-size="24" fill="#0f172a">4×4 格 × 2 槽 = 32 槽</text>
<rect x="12" y="94" width="456" height="518" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="110" font-size="22" fill="#0f172a">64×64 圖；每格 16 畫素</text>
<rect x="80" y="152" width="352" height="352" fill="#fff" stroke="#64748b" stroke-width="2" />
<rect x="168" y="240" width="88" height="88" fill="#dbeafe" />
<path d="M80 152L80 504" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M80 152L432 152" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="80" y="532" font-size="22" fill="#0f172a" text-anchor="middle">0</text>
<text x="68" y="160" font-size="22" fill="#0f172a" text-anchor="end">0</text>
<path d="M168 152L168 504" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M80 240L432 240" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="168" y="532" font-size="22" fill="#0f172a" text-anchor="middle">16</text>
<text x="68" y="248" font-size="22" fill="#0f172a" text-anchor="end">16</text>
<path d="M256 152L256 504" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M80 328L432 328" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="256" y="532" font-size="22" fill="#0f172a" text-anchor="middle">32</text>
<text x="68" y="336" font-size="22" fill="#0f172a" text-anchor="end">32</text>
<path d="M344 152L344 504" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M80 416L432 416" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="344" y="532" font-size="22" fill="#0f172a" text-anchor="middle">48</text>
<text x="68" y="424" font-size="22" fill="#0f172a" text-anchor="end">48</text>
<path d="M432 152L432 504" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M80 504L432 504" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="432" y="532" font-size="22" fill="#0f172a" text-anchor="middle">64</text>
<text x="68" y="512" font-size="22" fill="#0f172a" text-anchor="end">64</text>
<text x="124" y="144" font-size="22" fill="#0f172a" text-anchor="middle">0</text>
<text x="28" y="204" font-size="22" fill="#0f172a" text-anchor="middle">0</text>
<text x="212" y="144" font-size="22" fill="#0f172a" text-anchor="middle">1</text>
<text x="28" y="292" font-size="22" fill="#0f172a" text-anchor="middle">1</text>
<text x="300" y="144" font-size="22" fill="#0f172a" text-anchor="middle">2</text>
<text x="28" y="380" font-size="22" fill="#0f172a" text-anchor="middle">2</text>
<text x="388" y="144" font-size="22" fill="#0f172a" text-anchor="middle">3</text>
<text x="28" y="468" font-size="22" fill="#0f172a" text-anchor="middle">3</text>
<text x="18" y="166" font-size="22" fill="#0f172a">gy</text>
<text x="28" y="570" font-size="24" fill="#0f172a">欄 gx=1，列 gy=1；中心 (16,20)</text>
<text x="28" y="600" font-size="22" fill="#0f172a">x=16 在格線上 → floor 後歸右格</text>
<rect x="124" y="218" width="88" height="88" fill="none" stroke="#dc2626" stroke-width="4.5" id="gt-box" data-xyxy="8,12,24,28"/>
<rect x="124" y="218" width="88" height="88" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 5" id="anchor-slot-0" data-xyxy="8,12,24,28"/>
<rect x="146" y="240" width="44" height="44" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" id="anchor-slot-1" data-xyxy="12,16,20,24"/>
<circle cx="168" cy="262" r="5" fill="#0f172a" id="gt-center" data-xy="16,20"/>
<path d="M174 268L289 322.5" fill="none" stroke="#475569" stroke-width="1.5"/>
<text x="294.5" y="339" font-size="22" fill="#0f172a">中心</text>
<rect x="12" y="628" width="456" height="142" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="666" font-size="24" fill="#7c3aed" font-weight="700">槽 0：16×16 → positive（1 槽）</text>
<text x="28" y="702" font-size="22" fill="#0f172a">尺寸 IoU=1；負責 GT 框與類別</text>
<text x="28" y="738" font-size="24" fill="#0f172a">objectness 目標=1</text>
<rect x="12" y="786" width="456" height="142" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="824" font-size="24" fill="#7c3aed" font-weight="700">槽 1：8×8 → ignore（1 槽）</text>
<text x="28" y="860" font-size="24" fill="#0f172a">尺寸 IoU=0.25 &gt; 0.2</text>
<text x="28" y="896" font-size="24" fill="#0f172a">本節自訂：不計任何 loss</text>
<rect x="12" y="944" width="456" height="180" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="982" font-size="24" fill="#0f172a" font-weight="700">其他 15 格 × 2 槽 = 30 negative</text>
<text x="28" y="1018" font-size="24" fill="#0f172a">只算 objectness，目標=0</text>
<text x="28" y="1054" font-size="24" fill="#0f172a">GT=[8,12,24,28]（16×16）</text>
<text x="28" y="1090" font-size="22" fill="#0f172a">紅實線：GT　紫虛線：anchor</text>
<text x="28" y="1154" font-size="22" fill="#0f172a">上方欄 gx；左側列 gy</text>
</g></svg>
