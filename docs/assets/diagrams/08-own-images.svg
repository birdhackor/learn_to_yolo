<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">Letterbox与框还原</title><desc id="desc">120乘80原图按宽缩为64乘43，上加10下加11。框减padding除实际scale后回原图。</desc><rect width="760" height="300" fill="#f8fafc"/><g font-family="sans-serif" font-size="20" fill="#172033"><rect x="30" y="65" width="240" height="160" fill="#172033"/><rect x="70" y="85" width="80" height="40" fill="#ef4444"/><text x="30" y="45">原圖 W120×H80</text><text x="30" y="260">框 [20,10,60,30]</text><text x="288" y="145">→</text><rect x="350" y="35" width="192" height="192" fill="#94a3b8"/><rect x="350" y="65" width="192" height="129" fill="#172033"/><rect x="382" y="81.125" width="64" height="32.25" fill="#ef4444"/><text x="570" y="65">上 padding 10</text><text x="570" y="115">有效圖 64×43</text><text x="570" y="175">下 padding 11</text><text x="330" y="265">還原：減 padding，再除實際 sx／sy</text></g></svg>
