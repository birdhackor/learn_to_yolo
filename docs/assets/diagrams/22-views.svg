<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1110" viewBox="0 0 520 1110" role="img" aria-labelledby="title desc"><title id="title">實際原圖與兩個 global view</title><desc id="desc">原圖按固定seed生成，兩個view按固定generator生成；另顯示完全裁走物件的8乘8反例。</desc><!-- Actual inputs recreated from 22-views.json; source samples=1 seed=101 index=0; view generator seed=22. --><rect width="520" height="1110" rx="16" fill="#f7f9fc"/><g font-family="Noto Sans CJK TC, sans-serif" font-size="24" fill="#152c43"><text x="24" y="38" font-size="27" fill="#152c43" font-weight="bold">一張圖 → 兩個 global view</text><text x="24" y="76" font-size="24" fill="#152c43" font-weight="normal">實際 pixels；原圖 32×32</text><image x="160" y="100" width="200" height="200" href="data:image/png;base64," style="image-rendering:pixelated"/><rect x="166.25" y="106.25" width="175.0" height="175.0" fill="none" stroke="#238263" stroke-width="4"/><rect x="172.5" y="106.25" width="168.75" height="168.75" fill="none" stroke="#bd6b22" stroke-width="4"/><text x="30" y="341" font-size="24" fill="#238263" font-weight="normal">A 原圖 crop = [1, 1, 29, 29]</text><text x="30" y="381" font-size="24" fill="#a45b1e" font-weight="normal">B 原圖 crop = [2, 1, 29, 28]</text><text x="30" y="424" font-size="23" fill="#152c43" font-weight="normal">裁切 → resize → 可翻轉、調亮度</text><image x="38" y="457" width="190" height="190" href="data:image/png;base64," style="image-rendering:pixelated"/><image x="292" y="457" width="190" height="190" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="75" y="686" font-size="24" fill="#152c43" font-weight="normal">global A</text><text x="327" y="686" font-size="24" fill="#152c43" font-weight="normal">global B</text><text x="30" y="729" font-size="24" fill="#152c43" font-weight="normal">兩份輸入都是 [3,32,32]</text><text x="30" y="789" font-size="25" fill="#152c43" font-weight="bold">額外反例：crop 完全不含物件</text><image x="164" y="816" width="192" height="192" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="30" y="1050" font-size="24" fill="#152c43" font-weight="normal">原圖 crop = [0, 0, 8, 8]</text><text x="30" y="1088" font-size="23" fill="#152c43" font-weight="normal">這個額外反例不加入小模型訓練。</text></g></svg>
