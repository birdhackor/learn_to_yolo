<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1210" role="img" aria-labelledby="title desc">
<title id="title">四個空間位置的 attention 計算</title>
<desc id="desc">上半直向顯示feature map [1,2,2,2]轉tokens [1,4,2]，各自線性投影得Q K V，初值為單位矩陣。Q K產生每列加總1的weights [1,4,4]，V繞過softmax直接供weights@V矩陣乘法，輸出[1,4,2]再還原圖[1,2,2,2]。下半四位置按row-major編號：左上第1 [1,0]、右上第2 [0,1]、左下第3 [1,1]、右下第4 [0,0]；箭頭從左上接收者指來源，讀第1和3各0.3349，第2和4各0.1651。權重線寬仍為20乘權重。</desc>
<defs><marker id="flow" viewBox="0 0 14 12" refX="0" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L14 6L0 12Z" fill="#2563eb"/></marker><marker id="weight" viewBox="0 0 16 14" refX="0" refY="7" markerWidth="16" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L16 7L0 14Z" fill="#b45309"/></marker></defs>
<rect x="0" y="0" width="480" height="1210" rx="0" fill="#f8fafc" />
<rect x="104" y="16" width="272" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
<text x="240.0" y="44" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">Feature map [1,2,2,2]</text>
<text x="240.0" y="71" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">N = H × W = 4</text>
<text x="240.0" y="98" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">空間位置尚在 H、W 軸</text>
<path d="M240 112V132" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
<rect x="104" y="146" width="272" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
<text x="240.0" y="174" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">Spatial tokens [1,4,2]</text>
<text x="240.0" y="201" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">一列一個空間位置</text>
<text x="240.0" y="228" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">每列有 2 個 channel 值</text>
<path d="M240 242V262" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
<rect x="80" y="276" width="320" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
<text x="240.0" y="304" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">Q、K、V：各 [1,4,2]</text>
<text x="240.0" y="331" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">三份可學線性投影</text>
<text x="240.0" y="358" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">本例初值都是單位矩陣</text>
<path d="M166 372V422" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
<path d="M352 372V606" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
<text x="35" y="396" font-family="sans-serif" font-size="18" text-anchor="start" fill="#1e3a8a" font-weight="normal">Q、K：</text>
<text x="35" y="423" font-family="sans-serif" font-size="18" text-anchor="start" fill="#1e3a8a" font-weight="normal">讀取比例</text>
<text x="366" y="448" font-family="sans-serif" font-size="18" text-anchor="start" fill="#1e3a8a" font-weight="normal">V：內容</text>
<text x="366" y="478" font-family="sans-serif" font-size="18" text-anchor="start" fill="#1e3a8a" font-weight="normal">不經過</text>
<text x="366" y="505" font-family="sans-serif" font-size="18" text-anchor="start" fill="#1e3a8a" font-weight="normal">softmax</text>
<rect x="24" y="436" width="284" height="98" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
<text x="166.0" y="464" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">softmax(QKᵀ/√2)</text>
<text x="166.0" y="491" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">weights [1,4,4]</text>
<text x="166.0" y="518" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">每列權重合計 1</text>
<path d="M166 534V606" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
<text x="96" y="574" font-family="sans-serif" font-size="18" text-anchor="start" fill="#1e3a8a" font-weight="normal">weights</text>
<rect x="76" y="620" width="328" height="98" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
<text x="240.0" y="648" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">weights @ V：矩陣乘法</text>
<text x="240.0" y="675" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">output tokens [1,4,2]</text>
<text x="240.0" y="702" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="normal">還原成圖 [1,2,2,2]</text>
<path d="M166 718V750" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
<rect x="12" y="750" width="456" height="446" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2" />
<text x="28" y="780" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="700">權重表第 1 列：</text>
<text x="28" y="811" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="700">左上從四個位置各讀多少</text>
<rect x="108" y="842" width="116" height="70" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
<text x="166" y="867" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="normal">第 1 個</text>
<text x="166" y="897" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="normal">[1,0]</text>
<rect x="338" y="842" width="116" height="70" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
<text x="396" y="867" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="normal">第 2 個</text>
<text x="396" y="897" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="normal">[0,1]</text>
<rect x="108" y="1008" width="116" height="70" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
<text x="166" y="1033" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="normal">第 3 個</text>
<text x="166" y="1063" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="normal">[1,1]</text>
<rect x="338" y="1008" width="116" height="70" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
<text x="396" y="1033" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="normal">第 4 個</text>
<text x="396" y="1063" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="normal">[0,0]</text>
<path d="M108 858C50 842 49 908 94 900" fill="none" stroke="#b45309" stroke-width="6.698" marker-end="url(#weight)"/>
<path d="M224 877H322" fill="none" stroke="#b45309" stroke-width="3.302" marker-end="url(#weight)"/>
<path d="M152 912V992" fill="none" stroke="#b45309" stroke-width="6.698" marker-end="url(#weight)"/>
<path d="M220 912L325.6 997.9" fill="none" stroke="#b45309" stroke-width="3.302" marker-end="url(#weight)"/>
<text x="90" y="841" font-family="sans-serif" font-size="18" text-anchor="end" fill="#92400e" font-weight="normal">0.3349</text>
<text x="281" y="863" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#92400e" font-weight="normal">0.1651</text>
<text x="172" y="972" font-family="sans-serif" font-size="18" text-anchor="start" fill="#92400e" font-weight="normal">0.3349</text>
<text x="325" y="948" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#92400e" font-weight="normal">0.1651</text>
<text x="28" y="1112" font-family="sans-serif" font-size="18" text-anchor="start" fill="#334155" font-weight="normal">格內：token 編號與向量值</text>
<text x="28" y="1138" font-family="sans-serif" font-size="18" text-anchor="start" fill="#334155" font-weight="normal">本例初值：Q＝K＝V＝token</text>
<text x="28" y="1164" font-family="sans-serif" font-size="18" text-anchor="start" fill="#334155" font-weight="normal">箭頭從接收位置指向來源位置；</text>
<text x="28" y="1190" font-family="sans-serif" font-size="18" text-anchor="start" fill="#334155" font-weight="normal">線越粗，權重越大。</text>
</svg>
