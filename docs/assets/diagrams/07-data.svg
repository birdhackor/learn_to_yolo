<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">64×64 圖片上的兩個固定矩形</title><desc id="desc">左側有紅框8,12,24,28与蓝框40,36,56,52。右側解釋RGB CHW與半開區間。</desc><rect width="720" height="330" fill="#f8fafc"/><g transform="translate(35,25)"><rect width="256" height="256" fill="#172033"/><rect x="32" y="48" width="64" height="64" fill="#ef4444"/><rect x="160" y="144" width="64" height="64" fill="#3b82f6"/><text x="0" y="283" font-size="18" fill="#1e293b">輸入 64×64 pixel，放大 4 倍顯示</text></g><g font-family="sans-serif" font-size="21" fill="#172033"><text x="330" y="65">紅：xyxy = [8,12,24,28]</text><text x="330" y="105">藍：xyxy = [40,36,56,52]</text><text x="330" y="160">紅色像素：x ∈ [8,24)</text><text x="330" y="195">y ∈ [12,28)，面積 16×16</text><text x="330" y="245">image[channel, y, x]</text><text x="330" y="280">RGB → 3×64×64 float32</text></g></svg>
