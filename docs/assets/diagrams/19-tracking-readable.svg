<rect x="612.0" y="110" width="23" height="18" fill="#2563eb" />
<text x="538" y="106" font-family="sans-serif" font-size="17">A：ID2</text>
<rect x="566.4" y="147" width="23" height="18" fill="#dc2626" />
<text x="538" y="143" font-family="sans-serif" font-size="17">B：ID1</text>
</g><g transform="translate(20,442) scale(1.3) translate(-700,-55)"><rect x="700" y="55" width="155" height="120" fill="white" stroke="#94a3b8" />
