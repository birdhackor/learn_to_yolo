<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1480" role="img" aria-labelledby="t d"><title id="t">max_age=2 時的 ID 切換：上一框法 3 次，速度預測法 0 次</title>
<desc id="d">六幀畫面，兩個真實身分 A 與 B。上列用上一框法配對，ID 切換 3 次；下列用速度預測法，ID 切換 0 次。兩者都用 max_age=2。第 4 幀漏檢 B。 網頁上下兩組各有六格，每組依左至右、上至下排列；只改版面。</desc>
<rect width="480" height="1480" fill="#f8fafc" /><text x="20" y="30" fill="#0f172a" font-family="sans-serif" font-size="24">上一框法</text><text x="20" y="62" fill="#0f172a" font-family="sans-serif" font-size="24">ID 切換 3 次</text><g transform="translate(20,90) scale(1.3) translate(-20,-55)"><rect x="20" y="55" width="155" height="120" fill="white" stroke="#94a3b8" />
<text x="28" y="80" font-family="sans-serif" font-size="20">第 0 幀</text>
<rect x="56.4" y="110" width="23" height="18" fill="#dc2626" />
<text x="28" y="106" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="102.0" y="147" width="23" height="18" fill="#2563eb" />
<text x="28" y="143" font-family="sans-serif" font-size="17">B：ID2</text>
</g><g transform="translate(250,90) scale(1.3) translate(-190,-55)"><rect x="190" y="55" width="155" height="120" fill="white" stroke="#94a3b8" />
