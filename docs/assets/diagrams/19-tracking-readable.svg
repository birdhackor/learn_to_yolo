</g><text x="20" y="1310" fill="#0f172a" font-family="sans-serif" font-size="22">方塊顏色＝分配到的 track ID。</text><text x="20" y="1340" fill="#0f172a" font-family="sans-serif" font-size="22">A、B 只用來評分；第 4 幀 B 漏檢。</text><text x="20" y="1370" fill="#0f172a" font-family="sans-serif" font-size="22">兩方法吃同一份偵測框。</text><text x="20" y="1400" fill="#0f172a" font-family="sans-serif" font-size="22">水平位置是真的；上下分行只為標籤。</text><text x="20" y="1430" fill="#0f172a" font-family="sans-serif" font-size="22">配對時 A、B 的 y 座標相同。</text></svg>
