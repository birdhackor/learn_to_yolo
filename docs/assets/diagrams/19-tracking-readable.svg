<text x="198" y="106" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="256.8" y="147" width="23" height="18" fill="#2563eb" />
<text x="198" y="143" font-family="sans-serif" font-size="17">B：ID2</text>
</g><g transform="translate(20,266) scale(1.3) translate(-360,-55)"><rect x="360" y="55" width="155" height="120" fill="white" stroke="#94a3b8" />
