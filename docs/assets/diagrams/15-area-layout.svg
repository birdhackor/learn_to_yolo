<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 528" role="img" aria-labelledby="title desc">
 <title id="title">Area attention 的連續 token 分區</title>
 <desc id="desc">示意圖：每格代表一個位置（token），格子等大，只表示排列順序，不是畫素座標。16 個 token 排成 4×4，逐列由左到右編號 0 到 15（row-major）。A 是區域數，也就是程式裡的 areas；底色相同、沒有被粗線隔開的格子在同一區。左圖 A=4，每區 4 個 token，四區是四條水平帶：0–3、4–7、8–11、12–15。右圖 A=2，每區 8 個 token，兩區是 0–7 與 8–15。兩圖都用紅框標出 query，也就是 token0；用紫框標出本節會改動的 token：15 是主實驗，3 是練習。A=4 時 token0 可讀 0–3；A=2 時可讀 0–7；兩種分法都讀不到 token15。</desc>
 <rect width="720" height="528" fill="#f8fafc"/>
 <!-- A=4：token i 在第 i // 4 區；格子左上角 (24+78·欄, 134+62·列)。 -->
 <g stroke="#94a3b8" stroke-width="1">
  <rect x="24" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="102" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="180" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="258" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="24" y="196" width="76" height="60" fill="#dcfce7"/>
  <rect x="102" y="196" width="76" height="60" fill="#dcfce7"/>
  <rect x="180" y="196" width="76" height="60" fill="#dcfce7"/>
  <rect x="258" y="196" width="76" height="60" fill="#dcfce7"/>
  <rect x="24" y="258" width="76" height="60" fill="#fef3c7"/>
  <rect x="102" y="258" width="76" height="60" fill="#fef3c7"/>
  <rect x="180" y="258" width="76" height="60" fill="#fef3c7"/>
  <rect x="258" y="258" width="76" height="60" fill="#fef3c7"/>
  <rect x="24" y="320" width="76" height="60" fill="#e2e8f0"/>
  <rect x="102" y="320" width="76" height="60" fill="#e2e8f0"/>
  <rect x="180" y="320" width="76" height="60" fill="#e2e8f0"/>
  <rect x="258" y="320" width="76" height="60" fill="#e2e8f0"/>
 </g>
 <path d="M16 195H342M16 257H342M16 319H342" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
 <rect x="28" y="138" width="68" height="52" fill="none" stroke="#dc2626" stroke-width="3.5"/>
 <rect x="262" y="138" width="68" height="52" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
 <rect x="262" y="324" width="68" height="52" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
 <!-- A=2：token i 在第 i // 8 區；格子左上角 (386+78·欄, 134+62·列)。 -->
 <g stroke="#94a3b8" stroke-width="1">
  <rect x="386" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="464" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="542" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="620" y="134" width="76" height="60" fill="#dbeafe"/>
  <rect x="386" y="196" width="76" height="60" fill="#dbeafe"/>
  <rect x="464" y="196" width="76" height="60" fill="#dbeafe"/>
  <rect x="542" y="196" width="76" height="60" fill="#dbeafe"/>
  <rect x="620" y="196" width="76" height="60" fill="#dbeafe"/>
  <rect x="386" y="258" width="76" height="60" fill="#dcfce7"/>
  <rect x="464" y="258" width="76" height="60" fill="#dcfce7"/>
  <rect x="542" y="258" width="76" height="60" fill="#dcfce7"/>
  <rect x="620" y="258" width="76" height="60" fill="#dcfce7"/>
  <rect x="386" y="320" width="76" height="60" fill="#dcfce7"/>
  <rect x="464" y="320" width="76" height="60" fill="#dcfce7"/>
  <rect x="542" y="320" width="76" height="60" fill="#dcfce7"/>
  <rect x="620" y="320" width="76" height="60" fill="#dcfce7"/>
 </g>
 <path d="M378 257H704" stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none"/>
 <rect x="390" y="138" width="68" height="52" fill="none" stroke="#dc2626" stroke-width="3.5"/>
 <rect x="624" y="138" width="68" height="52" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
 <rect x="624" y="324" width="68" height="52" fill="none" stroke="#7c3aed" stroke-width="3.5"/>
 <rect x="25" y="405" width="22" height="22" fill="#ffffff" stroke="#dc2626" stroke-width="3.5"/>
 <rect x="25" y="443" width="22" height="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3.5"/>
 <g font-family="sans-serif" font-size="22" fill="#0f172a">
  <text x="24" y="40" font-size="24" font-weight="700">16 個 token 排成 4×4，逐列由左到右編號 0–15</text>
  <text x="24" y="78">A＝區域數 areas；底色相同的格子屬於同一區，粗線是區域邊界</text>
  <text x="24" y="118">A=4：每區 4 個 token</text>
  <text x="386" y="118">A=2：每區 8 個 token</text>
  <text x="58" y="424">紅框：query 0</text>
  <text x="58" y="462">紫框：本節會改動的 token（15 是主實驗，3 是練習）</text>
  <text x="24" y="508">A=4：0 可讀 0–3；A=2：0 可讀 0–7；兩者都讀不到 15</text>
 </g>
 <g font-family="sans-serif" font-size="24" fill="#0f172a" text-anchor="middle">
  <text x="62" y="173">0</text><text x="140" y="173">1</text><text x="218" y="173">2</text><text x="296" y="173">3</text>
  <text x="62" y="235">4</text><text x="140" y="235">5</text><text x="218" y="235">6</text><text x="296" y="235">7</text>
  <text x="62" y="297">8</text><text x="140" y="297">9</text><text x="218" y="297">10</text><text x="296" y="297">11</text>
  <text x="62" y="359">12</text><text x="140" y="359">13</text><text x="218" y="359">14</text><text x="296" y="359">15</text>
  <text x="424" y="173">0</text><text x="502" y="173">1</text><text x="580" y="173">2</text><text x="658" y="173">3</text>
  <text x="424" y="235">4</text><text x="502" y="235">5</text><text x="580" y="235">6</text><text x="658" y="235">7</text>
  <text x="424" y="297">8</text><text x="502" y="297">9</text><text x="580" y="297">10</text><text x="658" y="297">11</text>
  <text x="424" y="359">12</text><text x="502" y="359">13</text><text x="580" y="359">14</text><text x="658" y="359">15</text>
 </g>
</svg>
