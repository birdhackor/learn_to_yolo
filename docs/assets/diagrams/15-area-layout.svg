<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 395" role="img" aria-labelledby="title desc">
<title id="title">Area attention的連續token分區</title><desc id="desc">左圖四條水平帶、右圖兩條水平帶。Query0與token3同區，token15在其他區。圖上的分區與4乘4 row-major reshape一致。</desc>
