<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
 <title id="title">水平翻轉與裁切：紅色畫素和框一起變</title>
 <desc id="desc">按比例繪製：每 1 畫素畫成 3 個單位，x 向右、y 向下；三張圖用同一個比例。左上 ① 是 64×64 原圖：深色背景上的紅色是物件的畫素 x=8…23、y=12…27，綠線是它的框 [8,12,24,28]；白色虛線是裁切區 x [16,48)、y [8,40)，左邊界 x=16 正好把紅色切成左右兩半。往右的箭頭標「水平翻轉」，下方算式是新 x1＝64−24＝40、新 x2＝64−8＝56。右上 ② 是翻轉後的 64×64 圖：紅色移到畫素 x=40…55，框變成 [40,12,56,28]，y 不變。② 畫了 4×4 格線，每格 16 畫素，上方標 gx=0 到 gx=3，右側標 gy=0 到 gy=3。白色箭頭從空心點（flip 前的中心 (16,20)，它的負責格 gx=1、gy=1 畫成淡藍虛線）指到白色實心點（flip 後的中心 (48,20)，負責格 gx=3、gy=1 畫成亮藍虛線）。兩個中心的 x 都壓在直格線上，取 floor 後歸右邊那格；② 下方的對照卡列出 flip 前、後的中心與負責格，並寫出 48/16＝3、20/16＝1.25。往下的箭頭標出裁切區 x [16,48)、y [8,40)，指到左下的 ③：從 ① 的裁切區切出的 32×32 圖，畫在裁切區正下方。紅色只剩原本的右半，在新圖的畫素 x=0…7、y=4…19，框是 [0,4,8,20]；新圖左緣外的灰色虛線方塊是被裁掉的左半，寬 8、高 16，不在新圖裡，只是標出被裁掉的部分。③ 旁邊註明可見面積 8×16＝128、原面積 16×16＝256、可見比例 128/256＝0.5。</desc>
 <rect width="720" height="540" fill="#f8fafc"/>
 <!-- 依比例：1 畫素畫成 3 個單位。①原圖 (x,y) 畫在 (48+3x, 120+3y)；②翻轉後 (x,y) 畫在 (408+3x, 120+3y)；③裁切後 (x,y) 畫在 (96+3x, 400+3y)，正好在①裁切區的正下方。 -->

 <!-- ① 原圖：紅色畫素 x 8…23、y 12…27；裁切區 x [16,48)、y [8,40)。 -->
 <rect x="48" y="120" width="192" height="192" fill="#0f172a"/>
 <rect x="72" y="156" width="48" height="48" fill="#ef4444"/>
 <rect x="96" y="144" width="96" height="96" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="8 5"/>
 <rect x="72" y="156" width="48" height="48" fill="none" stroke="#4ade80" stroke-width="3"/>

 <!-- ② 水平翻轉後：紅色畫素 x 40…55；格線在 x、y＝16、32、48。 -->
 <rect x="408" y="120" width="192" height="192" fill="#0f172a"/>
 <rect x="528" y="156" width="48" height="48" fill="#ef4444"/>
 <path d="M456 120V312M504 120V312M552 120V312M408 168H600M408 216H600M408 264H600" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity=".55"/>
 <!-- flip 前的負責格 (gx=1, gy=1)：x [16,32)、y [16,32)，淡藍；flip 後 (gx=3, gy=1)：x [48,64)、y [16,32)，亮藍。 -->
 <rect x="457.5" y="169.5" width="45" height="45" fill="none" stroke="#60a5fa" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="5 4"/>
 <rect x="553.5" y="169.5" width="45" height="45" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="7 4"/>
 <rect x="528" y="156" width="48" height="48" fill="none" stroke="#4ade80" stroke-width="3"/>
 <!-- 中心 (16,20) → (48,20)。 -->
 <path d="M462 180H539" stroke="#f8fafc" stroke-width="2.5"/>
 <path d="M537 174L547 180L537 186Z" fill="#f8fafc"/>
 <circle cx="456" cy="180" r="5" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
 <circle cx="552" cy="180" r="5.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>

 <!-- ③ 裁切後：紅色畫素 x 0…7、y 4…19；灰色是被裁掉的 x [−8,0)。 -->
 <rect x="96" y="400" width="96" height="96" fill="#0f172a"/>
 <rect x="72" y="412" width="24" height="48" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
 <rect x="96" y="412" width="24" height="48" fill="#ef4444"/>
 <rect x="96" y="412" width="24" height="48" fill="none" stroke="#4ade80" stroke-width="3"/>

 <!-- 流程箭頭：① → ②（水平翻轉）、① → ③（裁切）。 -->
 <g fill="none" stroke="#334155" stroke-width="3">
  <path d="M252 216H395M386 209L396 216L386 223"/>
  <path d="M144 320V388M137 379L144 389L151 379"/>
 </g>

 <!-- ② 的對照卡；表頭小圖示畫在深色底上，和圖中一樣。 -->
 <rect x="400" y="328" width="312" height="146" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
 <rect x="472" y="337" width="36" height="28" rx="3" fill="#0f172a"/>
 <rect x="486" y="343" width="16" height="16" fill="none" stroke="#60a5fa" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 2"/>
 <circle cx="486" cy="351" r="4" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
 <rect x="592" y="337" width="36" height="28" rx="3" fill="#0f172a"/>
 <rect x="606" y="343" width="16" height="16" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 2"/>
 <circle cx="606" cy="351" r="4" fill="#f8fafc" stroke="#0f172a" stroke-width="1"/>

 <g font-family="sans-serif" fill="#0f172a">
  <g font-size="20" font-weight="700">
   <text x="48" y="34">① 原圖 64×64</text>
   <text x="408" y="34">② 水平翻轉後</text>
   <text x="208" y="418">③ 裁切結果 32×32</text>
  </g>
  <g font-size="17">
   <text x="48" y="60" fill="#15803d">框 [8,12,24,28]</text>
   <text x="48" y="84" fill="#b91c1c">紅色畫素 x=8…23</text>
   <text x="408" y="60" fill="#15803d">框 [40,12,56,28]</text>
   <text x="408" y="84" fill="#b91c1c">紅色畫素 x=40…55</text>
   <text x="208" y="446" fill="#15803d">框 [0,4,8,20]</text>
   <text x="208" y="472">可見面積 8×16＝128</text>
   <text x="208" y="496">原面積 16×16＝256</text>
   <text x="208" y="520">可見比例 128/256＝0.5</text>
  </g>
  <g font-size="16" fill="#6d28d9">
   <g text-anchor="middle"><text x="432" y="108">gx=0</text><text x="480" y="108">gx=1</text><text x="528" y="108">gx=2</text><text x="576" y="108">gx=3</text></g>
   <text x="608" y="150">gy=0</text><text x="608" y="198">gy=1</text><text x="608" y="246">gy=2</text><text x="608" y="294">gy=3</text>
  </g>
  <text x="324" y="196" font-size="18" text-anchor="middle">水平翻轉</text>
  <g font-size="16" fill="#475569" text-anchor="middle">
   <text x="324" y="246">新 x1＝64−24＝40</text>
   <text x="324" y="270">新 x2＝64−8＝56</text>
  </g>
  <text x="160" y="364" font-size="16" fill="#334155">裁切區 x [16,48)、y [8,40)</text>
  <text x="64" y="442" font-size="16" fill="#475569" text-anchor="end">被裁掉</text>
  <g font-size="16">
   <text x="514" y="357" fill="#475569">flip 前</text>
   <text x="634" y="357" fill="#475569">flip 後</text>
   <text x="412" y="388">中心</text><text x="472" y="388">(16,20)</text><text x="592" y="388">(48,20)</text>
   <text x="412" y="414">負責格</text><text x="472" y="414">(gx=1, gy=1)</text><text x="592" y="414">(gx=3, gy=1)</text>
   <text x="412" y="442" fill="#334155">每格 16 畫素：48/16＝3、20/16＝1.25</text>
   <text x="412" y="464" fill="#334155">中心 x 壓在格線上，取 floor 歸右邊那格</text>
  </g>
 </g>
</svg>
