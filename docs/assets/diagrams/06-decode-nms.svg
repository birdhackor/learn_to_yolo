<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1184" role="img" aria-labelledby="title desc">
<title id="title">NMS 移除人工重複框，但保留高分錯框</title>
<desc id="desc">上下畫同一張64×64輸入圖，每張按每畫素4.5 SVG單位繪製。上圖三候選：黃索引0 [23.2,24,39.2,32]分數0.64；藍索引1 [28,24,44,32]分數0.72；紅索引2 [4,52,12,60]分數0.855。綠填色是唯一真值，與藍框重合。黃藍IoU約0.5385，高於NMS門檻0.5，因此下圖只保留[2,1]。紅背景誤報仍在；score提高至0.75只留紅錯框。全部候選為人工指定，同類class0，不是訓練成果。</desc>
<defs><marker id="flow" viewBox="0 0 14 12" refX="0" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L14 6L0 12Z" fill="#2563eb"/></marker><marker id="weight" viewBox="0 0 16 14" refX="0" refY="7" markerWidth="16" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L16 7L0 14Z" fill="#b45309"/></marker></defs>
<rect x="0" y="0" width="460" height="1184" rx="0" fill="#f8fafc" />
<text x="24" y="34" font-family="sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700">分數篩選後：3 個人工候選</text>
<rect x="70" y="54" width="288" height="288" rx="0" fill="#0f172a" />
<path d="M142 54V342M70 126H358" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity=".55"/>
<path d="M214 54V342M70 198H358" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity=".55"/>
<path d="M286 54V342M70 270H358" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity=".55"/>
<rect x="196" y="162" width="72" height="36" rx="0" fill="#4ade80" fill-opacity=".35"/>
<rect x="196" y="162" width="72" height="36" rx="0" fill="none" stroke="#38bdf8" stroke-width="2" style="stroke-width:3"/>
<rect x="88" y="288" width="36" height="36" rx="0" fill="none" stroke="#fb7185" stroke-width="2" style="stroke-width:3"/>
<rect x="174.4" y="162" width="72" height="36" rx="0" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="6 4" style="stroke-width:3"/>
<text x="185.2" y="152" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#facc15" font-weight="700">0</text>
<text x="257.2" y="152" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#38bdf8" font-weight="700">1</text>
<text x="157" y="315" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#fb7185" font-weight="700">2</text>
<text x="24" y="378" font-family="sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="normal">索引 0：黃框，score 0.64</text>
<text x="24" y="410" font-family="sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="normal">索引 1：藍框，score 0.72</text>
<text x="24" y="442" font-family="sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="normal">索引 2：紅框，score 0.855</text>
<path d="M214 460V488" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#flow)"/>
<text x="24" y="532" font-family="sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700">NMS 後：保留索引 [2,1]</text>
<rect x="70" y="554" width="288" height="288" rx="0" fill="#0f172a" />
<path d="M142 554V842M70 626H358" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity=".55"/>
<path d="M214 554V842M70 698H358" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity=".55"/>
<path d="M286 554V842M70 770H358" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity=".55"/>
<rect x="196" y="662" width="72" height="36" rx="0" fill="#4ade80" fill-opacity=".35"/>
<rect x="196" y="662" width="72" height="36" rx="0" fill="none" stroke="#38bdf8" stroke-width="2" style="stroke-width:3"/>
<rect x="88" y="788" width="36" height="36" rx="0" fill="none" stroke="#fb7185" stroke-width="2" style="stroke-width:3"/>
<text x="257.2" y="652" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#38bdf8" font-weight="700">1</text>
<text x="157" y="815" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#fb7185" font-weight="700">2</text>
<text x="24" y="878" font-family="sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="normal">NMS IoU 門檻＝0.5</text>
<text x="24" y="910" font-family="sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="normal">黃框被刪掉，紅色錯框仍在</text>
<rect x="24" y="928" width="36" height="24" rx="3" fill="#0f172a" />
<rect x="30" y="933" width="24" height="14" rx="0" fill="#4ade80" fill-opacity=".35"/>
<text x="70" y="948" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="normal">綠填色：唯一真值</text>
<rect x="24" y="962" width="36" height="24" rx="3" fill="#0f172a" />
<rect x="30" y="967" width="24" height="14" rx="0" fill="none" stroke="#facc15" stroke-width="2" style="stroke-width:3" stroke-dasharray="6 4"/>
<text x="70" y="982" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="normal">黃虛線：重複預測</text>
<rect x="24" y="996" width="36" height="24" rx="3" fill="#0f172a" />
<rect x="30" y="1001" width="24" height="14" rx="0" fill="none" stroke="#fb7185" stroke-width="2" style="stroke-width:3"/>
<text x="70" y="1016" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="normal">紅實線：背景誤報</text>
<rect x="24" y="1030" width="36" height="24" rx="3" fill="#0f172a" />
<rect x="30" y="1035" width="24" height="14" rx="0" fill="none" stroke="#38bdf8" stroke-width="2" style="stroke-width:3"/>
<text x="70" y="1050" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="normal">藍框：保留預測，與真值重合</text>
<text x="24" y="1090" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="normal">框旁數字是候選索引；每格 16 畫素。</text>
<text x="24" y="1124" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="normal">人工案例，非訓練成果。</text>
<text x="24" y="1158" font-family="sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="normal">score 提高至 0.75，只留紅色錯框。</text>
</svg>
