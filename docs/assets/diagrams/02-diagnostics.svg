<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
 <title id="title">失敗三的 a–b 平面：validation 只把 b 反轉就全判錯</title>
 <desc id="desc">按比例繪製的 a–b 平面：橫軸 a、縱軸 b，兩軸同一比例，數值 1 畫成 180 個 SVG 單位；圖中 a 從 −1 到 1、b 從 −1.25 到 1.25，刻度標在 a＝−0.2、0、0.2 與 b＝−1、0、1，灰色細線是 a＝0 與 b＝0。紅色是類別 0、藍色是類別 1；實心點是訓練資料，空心點是 validation，每個點代表 4 筆相同的資料。訓練點：類別 0 在 (−0.2, −1)，類別 1 在 (0.2, 1)。validation 點：類別 0 在 (−0.2, 1)，類別 1 在 (0.2, −1)，a 不變、只把 b 反轉；圖中用同色虛線箭頭從訓練點指向同類別的 validation 點。黑色實線是學到的分界線 b＝−0.2a，即 0.2a＋b＝0：執行紀錄的 learned weights 兩列相減（類別 1 減類別 0）是 2×[0.195, 0.975]，分界線 0.195a＋0.975b＝0。這條線接近水平：b 的權重是 a 的 5 倍，模型主要靠 b 分類。分界線上方的淡藍區判成類別 1，下方的淡紅區判成類別 0。兩個訓練點都在自己類別那一邊，標「判對」；兩個 validation 點都跨到另一邊，標「判錯」。右側是圖例與說明：「每個點代表 4 筆相同的資料」「a、b 兩軸比例相同」，以及「validation 只把 b 反轉，點就跨到分界線另一邊」。</desc>
 <rect width="720" height="560" fill="#f8fafc"/>
 <!-- 依比例：(a,b) 畫在 SVG 的 (240+180a, 285−180b)；a、b 同比例，數值 1＝180 個 SVG 單位。 -->
 <!-- 點座標取自 lesson_cases/02-diagnostics.py；分界線由執行紀錄的 learned weights 算出：b＝−0.2a，a＝−1 → (60,249)，a＝1 → (420,321)。 -->
 <path id="region-class-1" d="M60 60H420V321L60 249Z" fill="#dbeafe"/>
 <path id="region-class-0" d="M60 249L420 321V510H60Z" fill="#fee2e2"/>
 <path d="M240 60V510M60 285H420" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
 <path id="boundary" d="M60 249L420 321" fill="none" stroke="#0f172a" stroke-width="3.5"/>
 <!-- 虛線箭頭：訓練點 → 同類別的 validation 點（a 不變、b 反轉）。 -->
 <path d="M204 452V132" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
 <path d="M204 118L197 132H211Z" fill="#dc2626"/>
 <path d="M276 118V438" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6"/>
 <path d="M276 452L269 438H283Z" fill="#2563eb"/>
 <!-- 訓練點（實心）與 validation 點（空心）。 -->
 <circle id="train-0" cx="204" cy="465" r="10" fill="#dc2626" stroke="#fff" stroke-width="2"/>
 <circle id="train-1" cx="276" cy="105" r="10" fill="#2563eb" stroke="#fff" stroke-width="2"/>
 <circle id="val-0" cx="204" cy="105" r="9" fill="#fff" stroke="#dc2626" stroke-width="3"/>
 <circle id="val-1" cx="276" cy="465" r="9" fill="#fff" stroke="#2563eb" stroke-width="3"/>
 <!-- 座標軸與刻度。 -->
 <path d="M60 60V510H420" fill="none" stroke="#334155" stroke-width="2.5"/>
 <path d="M54 105H60M54 285H60M54 465H60M204 510V516M240 510V516M276 510V516" fill="none" stroke="#334155" stroke-width="2"/>
 <!-- 右側圖例符號。 -->
 <circle cx="560" cy="117" r="9" fill="#dc2626" stroke="#fff" stroke-width="2"/>
 <circle cx="650" cy="117" r="8" fill="#fff" stroke="#dc2626" stroke-width="3"/>
 <circle cx="560" cy="153" r="9" fill="#2563eb" stroke="#fff" stroke-width="2"/>
 <circle cx="650" cy="153" r="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
 <path d="M450 466V430" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
 <path d="M450 418L444 430H456Z" fill="#dc2626"/>
 <path d="M468 418V454" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
 <path d="M468 466L462 454H474Z" fill="#2563eb"/>
 <g font-family="sans-serif" fill="#0f172a">
  <g font-size="18" fill="#475569">
   <g text-anchor="end"><text x="48" y="111">1</text><text x="48" y="291">0</text><text x="48" y="471">−1</text></g>
   <g text-anchor="middle"><text x="204" y="538">−0.2</text><text x="240" y="538">0</text><text x="276" y="538">0.2</text></g>
  </g>
  <text x="60" y="44" font-size="20" text-anchor="middle">b</text>
  <text x="432" y="517" font-size="20">a</text>
  <g font-size="20" fill="#334155">
   <text x="186" y="112" text-anchor="end" font-weight="700">判錯</text>
   <text x="294" y="112">判對</text>
   <text x="186" y="472" text-anchor="end">判對</text>
   <text x="294" y="472" font-weight="700">判錯</text>
  </g>
  <g font-size="20">
   <text x="70" y="232" fill="#1d4ed8">判成類別 1</text>
   <text x="70" y="316" fill="#b91c1c">判成類別 0</text>
  </g>
  <g text-anchor="middle" font-size="18" fill="#475569"><text x="560" y="84">訓練</text><text x="650" y="84">validation</text></g>
  <g font-size="20">
   <text x="444" y="124">類別 0</text>
   <text x="444" y="160">類別 1</text>
   <text x="430" y="328">學到的分界線 b＝−0.2a</text>
   <text x="484" y="434">validation 只把 b 反轉</text>
  </g>
  <g font-size="18" fill="#334155">
   <text x="444" y="202">每個點代表 4 筆相同的資料</text>
   <text x="444" y="230">a、b 兩軸比例相同</text>
   <text x="430" y="358">即 0.2a＋b＝0</text>
   <text x="484" y="465">點就跨到分界線另一邊</text>
  </g>
 </g>
</svg>
