<svg xmlns="http://www.w3.org/2000/svg" width="480" height="980" viewBox="0 0 480 980" role="img" aria-labelledby="title desc">
<title id="title">TinyViT完整分類路徑</title><desc id="desc">手工資料流。圖32×32，patch8×8，16個patch各32維，加CLS到17tokens。兩個PreLNblock後最終LN，取CLS，線性層輸出紅藍logits。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172554;font-size:24px} .small{font-size:22px}.head{font-size:28px;font-weight:700}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)} image{image-rendering:pixelated}</style>
<rect width="480" height="980" rx="12" fill="#f8fafc"/>
<text x="240" y="42" text-anchor="middle" style="font-size:26px">TinyViT：圖片 → 紅藍分數</text>
<rect x="44" y="76" width="392" height="80" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="108.0" text-anchor="middle" style="font-size:24px">RGB 圖</text>
<text x="240.0" y="140.0" text-anchor="middle" style="font-size:24px">[B,3,32,32]</text>
<path d="M240 164V184" class="line"/>
<rect x="44" y="194" width="392" height="80" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="226.0" text-anchor="middle" style="font-size:24px">patch 投影</text>
<text x="240.0" y="258.0" text-anchor="middle" style="font-size:24px">[B,16,32]</text>
<path d="M240 282V302" class="line"/>
<rect x="44" y="312" width="392" height="80" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="344.0" text-anchor="middle" style="font-size:24px">加 CLS ＋ 位置</text>
<text x="240.0" y="376.0" text-anchor="middle" style="font-size:24px">[B,17,32]</text>
<path d="M240 400V420" class="line"/>
<rect x="44" y="430" width="392" height="80" rx="10" fill="#ede9fe" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="462.0" text-anchor="middle" style="font-size:24px">Pre-LN block 1</text>
<text x="240.0" y="494.0" text-anchor="middle" style="font-size:24px">[B,17,32]</text>
<path d="M240 518V538" class="line"/>
<rect x="44" y="548" width="392" height="80" rx="10" fill="#ede9fe" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="580.0" text-anchor="middle" style="font-size:24px">Pre-LN block 2</text>
<text x="240.0" y="612.0" text-anchor="middle" style="font-size:24px">[B,17,32]</text>
<path d="M240 636V656" class="line"/>
<rect x="44" y="666" width="392" height="70" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="709.0" text-anchor="middle" style="font-size:24px">最終 LayerNorm</text>
<path d="M240 744V764" class="line"/>
<rect x="44" y="774" width="392" height="70" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="817.0" text-anchor="middle" style="font-size:24px">取 CLS：[B,32]</text>
<path d="M240 852V872" class="line"/>
<rect x="44" y="882" width="392" height="70" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="925.0" text-anchor="middle" style="font-size:24px">Linear(32,2) → [B,2]</text>
<text x="240" y="974" text-anchor="middle" style="font-size:22px">logits 順序：紅 0、藍 1</text>
</svg>
