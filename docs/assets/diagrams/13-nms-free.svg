<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 444" role="img" aria-labelledby="title desc">
 <title id="title">四個候選框的 x 範圍、兩套 target 與訓練後分數</title>
 <desc id="desc">依比例繪製的一維示意：只畫 x 方向，x 從 0 到 50 畫素，每 1 畫素畫成 8 個單位；所有框的 y 都是 0～10，長條的高度不代表 y。左半由上而下共五列，左側標名稱：第一列是兩個 GT（A、B 在同一列），以下每列一個候選，依序是 p0、p1、p2、p3。綠色是兩個 GT：A 在 x 0～10（[0,0,10,10]），B 在 x 20～30（[20,0,30,10]）；淡綠帶把 A、B 的 x 範圍往下延伸到 x 軸；x 40～50 標「無物件」。藍色是四個候選，框內寫 x 範圍：p0 在 0～10，與 A 相同；p1 在 1～11，是 A 右移 1，旁邊標「重複框」；p2 在 20～30，與 B 相同；p3 在 40～50，是背景。右半是表格，每列對應左邊同一列的候選；高分 0.959 用粗體藍字，低分 0.041 用灰字。一對多：target 依序是 1、1、1、0，訓練後分數是 0.959、0.959、0.959、0.041。一對一：target 依序是 1、0、1、0，訓練後分數是 0.959、0.041、0.959、0.041。分數是兩套 logit 都從 0（分數 0.5）開始，用 lr=1 的 SGD 各訓練 100 步後的結果，取自本頁「實際執行紀錄」（程式先四捨五入到小數第三位）。表格中 p1 那一列塗黃底：兩套 target 只在 p1 不同；p1 用一對多 target 升到 0.959，用一對一 target 降到 0.041。</desc>
 <!-- 依比例：x 畫素對應圖面 60+8x，x=0 在 60、x=50 在 460；只畫 x，長條高度不代表 y。 -->
 <rect width="720" height="444" fill="#f8fafc"/>
 <!-- 淡綠帶：A、B 的 x 範圍，從 GT 列延伸到 x 軸。 -->
 <g fill="#dcfce7" fill-opacity=".6">
  <rect x="60" y="108" width="80" height="218"/>
  <rect x="220" y="108" width="80" height="218"/>
 </g>
 <!-- 右側表格：p1 列黃底、表頭底線、一對多與一對一之間的分隔線。 -->
 <rect x="480" y="195" width="232" height="36" rx="6" fill="#fef3c7"/>
 <path d="M480 106H712M595 50V316" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
 <!-- GT：A [0,10]、B [20,30]。 -->
 <g fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5">
  <rect x="60" y="112" width="80" height="34"/>
  <rect x="220" y="112" width="80" height="34"/>
 </g>
 <!-- 候選：p0 [0,10]、p1 [1,11]、p2 [20,30]、p3 [40,50]，各占一列。 -->
 <g fill="#dbeafe" stroke="#2563eb" stroke-width="2.5">
  <rect x="60" y="154" width="80" height="34"/>
  <rect x="68" y="196" width="80" height="34"/>
  <rect x="220" y="238" width="80" height="34"/>
  <rect x="380" y="280" width="80" height="34"/>
 </g>
 <!-- x 軸：每 1 畫素一個小刻度，每 10 畫素一個大刻度。 -->
 <path d="M60 326H460" fill="none" stroke="#475569" stroke-width="1.5"/>
 <path d="M68 326V330M76 326V330M84 326V330M92 326V330M100 326V330M108 326V330M116 326V330M124 326V330M132 326V330M148 326V330M156 326V330M164 326V330M172 326V330M180 326V330M188 326V330M196 326V330M204 326V330M212 326V330M228 326V330M236 326V330M244 326V330M252 326V330M260 326V330M268 326V330M276 326V330M284 326V330M292 326V330M308 326V330M316 326V330M324 326V330M332 326V330M340 326V330M348 326V330M356 326V330M364 326V330M372 326V330M388 326V330M396 326V330M404 326V330M412 326V330M420 326V330M428 326V330M436 326V330M444 326V330M452 326V330" fill="none" stroke="#94a3b8" stroke-width="1"/>
 <path d="M60 326V334M140 326V334M220 326V334M300 326V334M380 326V334M460 326V334" fill="none" stroke="#475569" stroke-width="1.5"/>
 <g font-family="sans-serif" fill="#0f172a">
  <text x="16" y="34" font-size="22">p1 是 A 的重複框；兩套 target 只差在 p1</text>
  <text x="16" y="66" font-size="18" fill="#334155">位置：依比例，只畫 x</text>
  <text x="16" y="94" font-size="18" fill="#475569">所有框的 y 都是 0～10</text>
  <!-- 表頭 -->
  <g font-size="18" text-anchor="middle">
   <text x="534.5" y="66">一對多</text><text x="655.5" y="66">一對一</text>
  </g>
  <g font-size="17" fill="#475569" text-anchor="middle">
   <text x="506" y="94">target</text><text x="563" y="94">分數</text>
   <text x="627" y="94">target</text><text x="684" y="94">分數</text>
  </g>
  <!-- 左側列名 -->
  <g font-size="18">
   <text x="16" y="135.5" fill="#15803d">GT</text>
   <g fill="#1d4ed8"><text x="16" y="177.5">p0</text><text x="16" y="219.5">p1</text><text x="16" y="261.5">p2</text><text x="16" y="303.5">p3</text></g>
  </g>
  <!-- 框內文字 -->
  <g font-size="18" font-weight="700" fill="#15803d" text-anchor="middle">
   <text x="100" y="135.5">A</text><text x="260" y="135.5">B</text>
  </g>
  <text x="420" y="135" font-size="17" fill="#64748b" text-anchor="middle">無物件</text>
  <g font-size="17" fill="#1e3a8a" text-anchor="middle">
   <text x="100" y="177">0～10</text><text x="108" y="219">1～11</text>
   <text x="260" y="261">20～30</text><text x="420" y="303">40～50</text>
  </g>
  <text x="157" y="219" font-size="17" fill="#b45309">重複框</text>
  <!-- 表格內容：target 與 100 步後的分數 -->
  <g font-size="18" text-anchor="middle">
   <text x="506" y="177.5">1</text><text x="627" y="177.5">1</text>
   <text x="506" y="219.5">1</text><text x="627" y="219.5">0</text>
   <text x="506" y="261.5">1</text><text x="627" y="261.5">1</text>
   <text x="506" y="303.5">0</text><text x="627" y="303.5">0</text>
   <g font-weight="700" fill="#1d4ed8">
    <text x="563" y="177.5">0.959</text><text x="684" y="177.5">0.959</text>
    <text x="563" y="219.5">0.959</text>
    <text x="563" y="261.5">0.959</text><text x="684" y="261.5">0.959</text>
   </g>
   <g fill="#64748b">
    <text x="684" y="219.5">0.041</text>
    <text x="563" y="303.5">0.041</text><text x="684" y="303.5">0.041</text>
   </g>
  </g>
  <!-- x 軸刻度 -->
  <g font-size="17" fill="#475569" text-anchor="middle">
   <text x="60" y="355">0</text><text x="140" y="355">10</text><text x="220" y="355">20</text>
   <text x="300" y="355">30</text><text x="380" y="355">40</text><text x="460" y="355">50</text>
  </g>
  <text x="482" y="355" font-size="17" fill="#475569">x（畫素）</text>
  <!-- 說明 -->
  <g font-size="18">
   <text x="16" y="394">分數：兩套都從 0.5 起，各自訓練 100 步後的結果（實際執行紀錄）</text>
   <text x="16" y="426">黃底：p1 用一對多 target 升到 0.959，用一對一 target 降到 0.041</text>
  </g>
 </g>
</svg>
