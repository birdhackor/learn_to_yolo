<svg xmlns="http://www.w3.org/2000/svg" width="400" height="430" viewBox="0 0 400 430" role="img" aria-labelledby="title desc">
<title id="title">bilinear：四個新格中心換回來源座標</title>
<desc id="desc">只畫 2×2 特徵放大到 4×4 的水平方向。兩個來源格中心在座標 0 與 1，第一列來源值是 1 與 2。align_corners=False 時，四個新格中心換回來源座標是 −0.25、0.25、0.75、1.25；超過來源中心範圍時取邊界值。align_corners=True 時，四個中心是 0、1/3、2/3、1，首末中心對齊來源中心。三條水平線共用同一來源座標軸；灰色垂直虛線標示 0 與 1。</desc>
<rect width="400" height="430" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#172033">
<text x="16" y="30" font-size="22">四個新格中心，在來源哪裡？</text>
<g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"><path d="M110 88V339"/><path d="M290 88V339"/></g>
<g stroke="#64748b" stroke-width="2"><path d="M45 99H355"/><path d="M45 203H355"/><path d="M45 307H355"/></g>
<g font-size="20"><text x="16" y="69">來源中心（第一列的值：1、2）</text><text x="16" y="172" fill="#1d4ed8">align_corners=False</text><text x="16" y="276" fill="#15803d">align_corners=True</text></g>
<g fill="#172033"><circle cx="110" cy="99" r="5"/><circle cx="290" cy="99" r="5"/></g>
<g fill="#2563eb"><circle cx="65" cy="203" r="5"/><circle cx="155" cy="203" r="5"/><circle cx="245" cy="203" r="5"/><circle cx="335" cy="203" r="5"/></g>
<g fill="#15803d"><circle cx="110" cy="307" r="5"/><circle cx="170" cy="307" r="5"/><circle cx="230" cy="307" r="5"/><circle cx="290" cy="307" r="5"/></g>
<g font-size="20" text-anchor="middle"><text x="110" y="127">0</text><text x="290" y="127">1</text><text x="65" y="232">−0.25</text><text x="155" y="232">0.25</text><text x="245" y="232">0.75</text><text x="335" y="232">1.25</text><text x="110" y="336">0</text><text x="170" y="336">1/3</text><text x="230" y="336">2/3</text><text x="290" y="336">1</text></g>
<g font-size="20" fill="#475569"><text x="16" y="378">三行共用來源座標軸。</text><text x="16" y="410">False 超過兩端時，用邊界值。</text></g>
</g></svg>
