 <path d="M372 272V277M436 272V277M500 272V277M564 272V277M628 272V277M367 272H372M367 208H372M367 144H372" stroke="#475569" stroke-width="1.5"/>
 <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3">
  <rect x="426" y="190" width="28" height="28" rx="8"/>
  <rect x="602" y="118" width="36" height="36" rx="8"/>
 </g>
 <g fill="#16a34a" stroke="#fff" stroke-width="1">
  <circle cx="436" cy="208" r="3.5"/><circle cx="444" cy="208" r="3.5"/><circle cx="436" cy="200" r="3.5"/>
  <circle cx="628" cy="144" r="3.5"/><circle cx="612" cy="144" r="3.5"/><circle cx="628" cy="128" r="3.5"/>
 </g>

