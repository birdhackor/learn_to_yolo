 <g fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 2.4">
  <circle cx="398" cy="460" r="8"/><circle cx="680" cy="370" r="8"/>
 </g>
 <g fill="#16a34a" stroke="#fff" stroke-width="1.5">
