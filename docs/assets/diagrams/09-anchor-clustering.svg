 <g font-family="sans-serif" fill="#0f172a">
  <text x="332" y="40" font-size="20" font-weight="700">6 個尺寸分兩群，中心移到群平均</text>
  <g font-size="15">
   <text x="350" y="70">訓練框尺寸</text><text x="459" y="70">初始中心</text>
   <!-- 整行放不下（會超出右格與 viewBox），括號另起一行，對齊「群平均」的起點。 -->
