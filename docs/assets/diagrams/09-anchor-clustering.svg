<svg xmlns="http://www.w3.org/2000/svg" width="480" height="2152" viewBox="0 0 480 2152" role="img" aria-labelledby="title desc">
<title id="title">中心對齊的尺寸 IoU與六個寬高尺寸的聚類</title>
<desc id="desc">上下圖板。①兩個尺寸 IoU 例子，兩框中心對齊；綠實線是訓練框，紫虛線是弱基線的16×16 anchor，黃區是交集。兩例同為1畫素對6 SVG單位。②寬高平面的六個尺寸，1畫素對10 SVG單位，點表示尺寸而非圖片位置。③④群0及群1各自放大，兩圖同為1畫素對110 SVG單位；橫軸寬、縱軸高。群0範圍7.3到9.7；群1寬29.8到32.2、高15.8到18.2。紫虛線圈是初始中心，紫菱形是群平均，箭頭是更新方向。第二輪中心不變，群平均即最後的anchor。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker><marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker></defs>
<rect width="480" height="2152" fill="#f8fafc"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a">
<text x="28" y="38" font-size="26" fill="#0f172a" font-weight="700">尺寸 IoU → 尺寸分群</text>
<text x="28" y="74" font-size="22" fill="#0f172a">① 綠：訓練框　紫：弱基線 anchor</text>
<rect x="12" y="96" width="456" height="292" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="132" font-size="24" fill="#0f172a" font-weight="700">① 中心對齊：8×8 與 16×16</text>
<text x="28" y="166" font-size="22" fill="#0f172a">黃：交集；十字：共同中心</text>
<rect x="192" y="180" width="96" height="96" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 5" />
<rect x="216" y="204" width="48" height="48" fill="#fde68a" stroke="#15803d" stroke-width="3" />
<path d="M234 228L246 228" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M240 222L240 234" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="28" y="315" font-size="22" fill="#0f172a">交集：min(寬)×min(高)=8×8</text>
<text x="28" y="350" font-size="24" fill="#0f172a">IoU=64/(64+256−64)=0.25</text>
<rect x="12" y="404" width="456" height="300" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="440" font-size="24" fill="#0f172a" font-weight="700">① 中心對齊：32×16 與 16×16</text>
<rect x="192" y="492" width="96" height="96" fill="#fde68a" />
<rect x="144" y="492" width="192" height="96" fill="none" stroke="#15803d" stroke-width="3" />
<rect x="192" y="492" width="96" height="96" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 5" />
<path d="M234 540L246 540" fill="none" stroke="#0f172a" stroke-width="2"/>
<path d="M240 534L240 546" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="28" y="634" font-size="22" fill="#0f172a">交集：min(寬)×min(高)=16×16</text>
<text x="28" y="670" font-size="24" fill="#0f172a">IoU=256/(512+256−256)=0.5</text>
<rect x="12" y="720" width="456" height="384" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="756" font-size="24" fill="#0f172a" font-weight="700">② 寬高平面：6 個尺寸</text>
<text x="28" y="790" font-size="22" fill="#475569">點表示尺寸，不是圖片位置</text>
<path d="M72 830L72 1030" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M72 1030L432 1030" fill="none" stroke="#475569" stroke-width="2"/>
<path d="M72 1030L72 1036" fill="none" stroke="#475569" stroke-width="2"/>
<text x="72" y="1061" font-size="22" fill="#0f172a" text-anchor="middle">0</text>
<path d="M152 1030L152 1036" fill="none" stroke="#475569" stroke-width="2"/>
<text x="152" y="1061" font-size="22" fill="#0f172a" text-anchor="middle">8</text>
<path d="M232 1030L232 1036" fill="none" stroke="#475569" stroke-width="2"/>
<text x="232" y="1061" font-size="22" fill="#0f172a" text-anchor="middle">16</text>
<path d="M312 1030L312 1036" fill="none" stroke="#475569" stroke-width="2"/>
<text x="312" y="1061" font-size="22" fill="#0f172a" text-anchor="middle">24</text>
<path d="M392 1030L392 1036" fill="none" stroke="#475569" stroke-width="2"/>
<text x="392" y="1061" font-size="22" fill="#0f172a" text-anchor="middle">32</text>
<path d="M66 1030L72 1030" fill="none" stroke="#475569" stroke-width="2"/>
<text x="60" y="1038" font-size="22" fill="#0f172a" text-anchor="end">0</text>
<path d="M66 950L72 950" fill="none" stroke="#475569" stroke-width="2"/>
<text x="60" y="958" font-size="22" fill="#0f172a" text-anchor="end">8</text>
<path d="M66 870L72 870" fill="none" stroke="#475569" stroke-width="2"/>
<text x="60" y="878" font-size="22" fill="#0f172a" text-anchor="end">16</text>
<text x="32" y="823" font-size="22" fill="#0f172a">高</text>
<text x="432" y="1090" font-size="22" fill="#0f172a" text-anchor="end">寬（畫素）</text>
<rect x="140" y="928" width="34" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="8" stroke-dasharray="5 4" />
<rect x="360" y="838" width="44" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="8" stroke-dasharray="5 4" />
<circle cx="152" cy="950" r="5" fill="#15803d" stroke="#fff" stroke-width="1" />
<circle cx="162" cy="950" r="5" fill="#15803d" stroke="#fff" stroke-width="1" />
<circle cx="152" cy="940" r="5" fill="#15803d" stroke="#fff" stroke-width="1" />
<circle cx="392" cy="870" r="5" fill="#15803d" stroke="#fff" stroke-width="1" />
<circle cx="372" cy="870" r="5" fill="#15803d" stroke="#fff" stroke-width="1" />
<circle cx="392" cy="850" r="5" fill="#15803d" stroke="#fff" stroke-width="1" />
<text x="175" y="960" font-size="22" fill="#15803d">群 0</text>
<text x="270" y="852" font-size="22" fill="#15803d">群 1</text>
<rect x="12" y="1120" width="456" height="496" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="1156" font-size="24" fill="#0f172a" font-weight="700">③ 群 0 放大</text>
<text x="28" y="1190" font-size="22" fill="#0f172a">[8,8]、[9,8]、[8,9]</text>
<rect x="108" y="1220" width="264" height="264" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
<path d="M185 1220L185 1484" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="185" y="1512" font-size="22" fill="#0f172a" text-anchor="middle">8</text>
<path d="M295 1220L295 1484" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="295" y="1512" font-size="22" fill="#0f172a" text-anchor="middle">9</text>
<path d="M108 1407L372 1407" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="94" y="1415" font-size="22" fill="#0f172a" text-anchor="end">8</text>
<path d="M108 1297L372 1297" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="94" y="1305" font-size="22" fill="#0f172a" text-anchor="end">9</text>
<text x="68" y="1212" font-size="22" fill="#0f172a">高</text>
<text x="388" y="1512" font-size="22" fill="#0f172a">寬</text>
<circle cx="185" cy="1407" r="12" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 3" />
<circle cx="185" cy="1407" r="7" fill="#15803d" stroke="#fff" stroke-width="1.5" />
<circle cx="295" cy="1407" r="7" fill="#15803d" stroke="#fff" stroke-width="1.5" />
<circle cx="185" cy="1297" r="7" fill="#15803d" stroke="#fff" stroke-width="1.5" />
<path d="M194.899 1397.1L214.596 1377.4" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple-arrow)"/>
<path d="M221.667 1362.33L229.667 1370.33L221.667 1378.33L213.667 1370.33Z" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/>
<text x="28" y="1548" font-size="22" fill="#7c3aed">初始 (8,8) → 群平均</text>
<text x="28" y="1584" font-size="24" fill="#7c3aed">(25/3,25/3)≈(8.33,8.33)</text>
<rect x="12" y="1624" width="456" height="496" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" rx="12" />
<text x="28" y="1660" font-size="24" fill="#0f172a" font-weight="700">④ 群 1 放大</text>
<text x="28" y="1694" font-size="22" fill="#0f172a">[32,16]、[30,16]、[32,18]</text>
<rect x="108" y="1724" width="264" height="264" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
<path d="M130 1724L130 1988" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="130" y="2016" font-size="22" fill="#0f172a" text-anchor="middle">30</text>
<path d="M240 1724L240 1988" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="240" y="2016" font-size="22" fill="#0f172a" text-anchor="middle">31</text>
<path d="M350 1724L350 1988" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="350" y="2016" font-size="22" fill="#0f172a" text-anchor="middle">32</text>
<path d="M108 1966L372 1966" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="94" y="1974" font-size="22" fill="#0f172a" text-anchor="end">16</text>
<path d="M108 1856L372 1856" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="94" y="1864" font-size="22" fill="#0f172a" text-anchor="end">17</text>
<path d="M108 1746L372 1746" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="94" y="1754" font-size="22" fill="#0f172a" text-anchor="end">18</text>
<text x="68" y="1716" font-size="22" fill="#0f172a">高</text>
<text x="388" y="2016" font-size="22" fill="#0f172a">寬</text>
<circle cx="350" cy="1746" r="12" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 3" />
<circle cx="350" cy="1966" r="7" fill="#15803d" stroke="#fff" stroke-width="1.5" />
<circle cx="130" cy="1966" r="7" fill="#15803d" stroke="#fff" stroke-width="1.5" />
<circle cx="350" cy="1746" r="7" fill="#15803d" stroke="#fff" stroke-width="1.5" />
<path d="M343.739 1758.52L281.139 1883.72" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#purple-arrow)"/>
<path d="M276.667 1884.67L284.667 1892.67L276.667 1900.67L268.667 1892.67Z" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/>
<text x="28" y="2052" font-size="22" fill="#7c3aed">初始 (32,18) → 群平均</text>
<text x="28" y="2088" font-size="24" fill="#7c3aed">(94/3,50/3)≈(31.33,16.67)</text>
<text x="28" y="2144" font-size="22" fill="#0f172a">紫虛線圈：初始　紫菱形：最後 anchor</text>
</g></svg>
