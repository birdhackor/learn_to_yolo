      群 0：(w,h) 畫在 (356+60(w−7.3), 358+60(9.7−h))；群 1：(w,h) 畫在 (548+60(w−29.8), 358+60(18.2−h))。 -->
 <rect x="356" y="358" width="144" height="144" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
