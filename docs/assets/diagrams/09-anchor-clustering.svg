<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" role="img" aria-labelledby="title desc">
 <title id="title">中心對齊算尺寸 IoU，與寬高平面上的兩群聚類</title>
 <desc id="desc">左右兩格。左格依比例繪製，1 畫素畫成 6 個單位，示範把兩個框的中心疊在一起後怎麼算尺寸 IoU：綠色實線是訓練框，紫色虛線是 16×16（本節弱基線的 anchor），黃色是交集，小十字是共同中心。上例 8×8 與 16×16：8×8 整個落在 16×16 裡，交集寬 min(寬)=8、交集高 min(高)=8，IoU=64/(64+256−64)=0.25。下例 32×16 與 16×16：兩框一樣高，16×16 整個落在 32×16 裡，交集寬 min(寬)=16、交集高 min(高)=16，IoU=256/(512+256−256)=0.5。右格是寬高平面：橫軸寬、縱軸高，單位畫素；這裡的點代表尺寸，不是圖上的位置。上方總覽依比例繪製，1 畫素畫成 8 個單位，橫軸畫 0 到 36、刻度 0、8、16、24、32，縱軸畫 0 到 20、刻度 0、8、16。六個綠點是本節的 6 個 train 尺寸 [8,8]、[9,8]、[8,9]、[32,16]、[30,16]、[32,18]：前三個歸群 0，後三個歸群 1。下方兩張放大圖用同一比例，1 畫素畫成 60 個單位：群 0 放大圖畫寬 7.3 到 9.7、高 7.3 到 9.7，群 1 放大圖畫寬 29.8 到 32.2、高 15.8 到 18.2。紫色虛線圈是初始中心 (8,8) 與 (32,18)，也就是第一筆與最後一筆尺寸；紫色菱形是第 1 輪更新後的群平均 (25/3,25/3)≈(8.33,8.33) 與 (94/3,50/3)≈(31.33,16.67)；紫色箭頭從初始中心指向群平均。第 2 輪的歸群與中心都不變，所以這兩個群平均就是最後的兩個 anchor。</desc>
 <rect width="720" height="568" fill="#f8fafc"/>
 <rect x="8" y="8" width="296" height="552" rx="10" fill="#fff" stroke="#e2e8f0"/>
 <rect x="316" y="8" width="396" height="552" rx="10" fill="#fff" stroke="#e2e8f0"/>

 <!-- 左格：依比例，1 畫素畫成 6 個單位。兩例的 16×16 都是 96×96 單位，左右位置對齊。 -->
 <!-- 上例：8×8 與 16×16，共同中心畫在 (120,174)。 -->
 <rect x="72" y="126" width="96" height="96" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4"/>
 <rect x="96" y="150" width="48" height="48" fill="#fde68a" stroke="#16a34a" stroke-width="2.5"/>
 <path d="M115 174H125M120 169V179" stroke="#0f172a" stroke-width="1.5"/>
 <path d="M96 203V243M144 203V243M149 150H189M149 198H189" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
 <path d="M102 238H138M184 156V192" stroke="#334155" stroke-width="1.5"/>
 <path d="M96 238L103 234.5V241.5ZM144 238L137 234.5V241.5ZM184 150L180.5 157H187.5ZM184 198L180.5 191H187.5Z" fill="#334155"/>

 <!-- 下例：32×16 與 16×16，共同中心畫在 (120,406)；兩框一樣高，上下邊重合。 -->
 <rect x="72" y="358" width="96" height="96" fill="#fde68a"/>
 <rect x="24" y="358" width="192" height="96" fill="none" stroke="#16a34a" stroke-width="2.5"/>
 <rect x="72" y="358" width="96" height="96" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4"/>
 <path d="M115 406H125M120 401V411" stroke="#0f172a" stroke-width="1.5"/>
 <path d="M72 459V475M168 459V475M221 358H241M221 454H241" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 2"/>
 <path d="M78 470H162M236 364V448" stroke="#334155" stroke-width="1.5"/>
 <path d="M72 470L79 466.5V473.5ZM168 470L161 466.5V473.5ZM236 358L232.5 365H239.5ZM236 454L232.5 447H239.5Z" fill="#334155"/>

 <g font-family="sans-serif" fill="#0f172a">
  <text x="24" y="40" font-size="20" font-weight="700">中心疊在一起，只比寬高</text>
  <text x="24" y="68" font-size="16">黃色交集=min(寬)×min(高)</text>
  <g font-size="17">
   <text x="24" y="110"><tspan fill="#15803d">8×8</tspan> 與 <tspan fill="#6d28d9">16×16</tspan></text>
   <text x="24" y="290">IoU=64/(64+256−64)=0.25</text>
   <text x="24" y="342"><tspan fill="#15803d">32×16</tspan> 與 <tspan fill="#6d28d9">16×16</tspan></text>
   <text x="24" y="522">IoU=256/(512+256−256)=0.5</text>
  </g>
  <g font-size="15" fill="#334155">
   <text x="120" y="260" text-anchor="middle">min(寬)=8</text>
   <text x="192" y="170">min(高)</text><text x="192" y="190">=8</text>
   <text x="120" y="434" text-anchor="middle" font-size="14">共同中心</text>
   <text x="120" y="492" text-anchor="middle">min(寬)=16</text>
   <text x="244" y="402">min(高)</text><text x="244" y="422">=16</text>
  </g>
 </g>

 <!-- 右格上方總覽：寬高平面上的點 (w,h) 畫在 (372+8w, 272−8h)，即 1 畫素＝8 單位。 -->
