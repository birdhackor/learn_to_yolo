<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" role="img" aria-labelledby="title desc">
 <title id="title">候選點到真值框四邊的四個距離</title>
 <desc id="desc">按比例繪製：每 1 畫素畫成 9 個單位，一格 8 畫素畫成 72 個單位；畫素座標 (x,y) 畫在 SVG 的 (64+9x, 104+9y)，x 向右、y 向下。整個白色方塊是 64×64 的輸入影像，灰線是 stride 8 的格線，上方與左側的刻度是畫素座標 0、8、16……64；下方的 0～7 是格的 column（第幾欄），右側的 0～7 是格的 row（第幾列），都從 0 起算。綠框是真值框 xyxy [12,16,40,36]。黑點是本例的候選點 (28,28)，它是第 (3,3) 格（column=3、row=3，從 0 起算）的中心：((3+0.5)×8,(3+0.5)×8)=(28,28)。從它拉出四支箭頭到綠框四邊：左 l=16 畫素（2 格），上 t=12 畫素（1.5 格），右 r=12 畫素（1.5 格），下 b=8 畫素（1 格）；四個距離都是正的，左右、上下的長度不相等，表示點不在框中心；框中心 (26,26) 畫成綠色小十字，在黑點的左上方。紅點是框外點 (44,28)，它是同一列第 (5,3) 格的中心，在綠框右側；紅色虛線箭頭從它往左指到綠框右邊 x=40，標 r=−4 畫素（−0.5 格）：右邊距離是負的。</desc>
 <!-- 依比例：畫素座標 (x,y) 畫在 SVG 的 (64+9x, 104+9y)；一格 8 畫素＝72 單位。
      真值框 [12,16,40,36] → x 172～424、y 248～428；候選點 (28,28) → (316,356)，
      在第 (3,3) 格 x 280～352、y 320～392 的正中央；框外點 (44,28) → (460,356)，
      在第 (5,3) 格 x 424～496、y 320～392 的正中央。 -->
 <rect width="720" height="790" fill="#f8fafc"/>
 <rect x="64" y="104" width="576" height="576" fill="#fff"/>
 <rect id="gt-fill" x="172" y="248" width="252" height="180" fill="#dcfce7"/>
 <!-- stride 8 格線：x、y 每 8 畫素一條。 -->
 <path d="M136 104V680M208 104V680M280 104V680M352 104V680M424 104V680M496 104V680M568 104V680M64 176H640M64 248H640M64 320H640M64 392H640M64 464H640M64 536H640M64 608H640" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
 <rect x="64" y="104" width="576" height="576" fill="none" stroke="#475569" stroke-width="1.5"/>
 <!-- 刻度線：上方 x、左側 y，每 8 畫素一條。 -->
 <path d="M64 97V104M136 97V104M208 97V104M280 97V104M352 97V104M424 97V104M496 97V104M568 97V104M640 97V104M57 104H64M57 176H64M57 248H64M57 320H64M57 392H64M57 464H64M57 536H64M57 608H64M57 680H64" fill="none" stroke="#475569" stroke-width="1.5"/>
 <rect id="gt-box" x="172" y="248" width="252" height="180" fill="none" stroke="#16a34a" stroke-width="3"/>
 <!-- 標籤底板：只遮住底下的格線，顏色和所在位置的底色相同。 -->
 <g fill="#fff">
  <rect x="68" y="329" width="98" height="52"/>
  <rect x="267" y="190" width="98" height="51"/>
  <rect x="270" y="436" width="92" height="51"/>
  <rect x="500" y="329" width="104" height="52"/>
 </g>
 <rect x="330" y="370" width="88" height="51" fill="#dcfce7"/>
 <!-- 四支箭頭：從候選點出發，箭尖停在綠框線內緣。 -->
 <path d="M306 356H185.5M316 346V261.5M326 356H410.5M316 366V414.5" fill="none" stroke="#334155" stroke-width="2.5"/>
 <path d="M173.5 356L185.5 351V361ZM316 249.5L311 261.5H321ZM422.5 356L410.5 351V361ZM316 426.5L311 414.5H321Z" fill="#334155"/>
 <!-- 框外點的右邊距離：往左指到 x=40，箭尖停在綠框線外緣。 -->
 <path d="M450 356H437.5" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3"/>
 <path d="M425.5 356L437.5 351V361Z" fill="#dc2626"/>
 <!-- 框中心 (26,26) → (298,338)：綠色小十字，標籤放在左上那一格，用細線連過去。 -->
 <path id="gt-center" d="M291 338H305M298 331V345" fill="none" stroke="#15803d" stroke-width="2.5"/>
 <path d="M262 307L292 332" fill="none" stroke="#15803d" stroke-width="1.5"/>
 <g font-family="sans-serif" font-size="15" fill="#15803d" text-anchor="middle"><text x="244" y="282">框中心</text><text x="244" y="301">(26,26)</text></g>
 <circle id="candidate-point" cx="316" cy="356" r="7" fill="#172554" stroke="#fff" stroke-width="1.5"/>
 <circle id="outside-point" cx="460" cy="356" r="7" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
 <g font-family="sans-serif" font-size="16" fill="#475569">
  <g text-anchor="middle">
   <text x="64" y="90">0</text><text x="136" y="90">8</text><text x="208" y="90">16</text><text x="280" y="90">24</text><text x="352" y="90">32</text><text x="424" y="90">40</text><text x="496" y="90">48</text><text x="568" y="90">56</text><text x="640" y="90">64</text>
  </g>
  <g text-anchor="end">
   <text x="50" y="110">0</text><text x="50" y="182">8</text><text x="50" y="254">16</text><text x="50" y="326">24</text><text x="50" y="398">32</text><text x="50" y="470">40</text><text x="50" y="542">48</text><text x="50" y="614">56</text><text x="50" y="686">64</text>
  </g>
  <text x="662" y="90">x →</text>
  <g font-size="14" fill="#64748b">
   <g text-anchor="middle"><text x="100" y="699">0</text><text x="172" y="699">1</text><text x="244" y="699">2</text><text x="316" y="699">3</text><text x="388" y="699">4</text><text x="460" y="699">5</text><text x="532" y="699">6</text><text x="604" y="699">7</text></g>
   <text x="652" y="699">column</text>
   <text x="652" y="124">row</text>
   <text x="652" y="145">0</text><text x="652" y="217">1</text><text x="652" y="289">2</text><text x="652" y="361">3</text><text x="652" y="433">4</text><text x="652" y="505">5</text><text x="652" y="577">6</text><text x="652" y="649">7</text>
  </g>
  <text x="18" y="384" text-anchor="middle">y</text><text x="18" y="408" text-anchor="middle">↓</text>
 </g>
 <g font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">
  <text x="117" y="350">l=16 畫素</text><text x="117" y="373">（2 格）</text>
  <text x="316" y="210">t=12 畫素</text><text x="316" y="233">（1.5 格）</text>
  <text x="374" y="390">r=12 畫素</text><text x="374" y="413">（1.5 格）</text>
  <text x="316" y="456">b=8 畫素</text><text x="316" y="479">（1 格）</text>
  <g fill="#b91c1c"><text x="552" y="350">r=−4 畫素</text><text x="552" y="373">（−0.5 格）</text></g>
 </g>
 <!-- 圖例 -->
 <rect x="24" y="719" width="18" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
 <circle cx="349" cy="728" r="7" fill="#172554"/>
 <circle cx="33" cy="762" r="7" fill="#dc2626"/>
 <g font-family="sans-serif" font-size="18">
  <text x="52" y="734" fill="#15803d">真值框 [12,16,40,36]</text>
  <text x="368" y="734" fill="#0f172a">本例的候選點 (28,28)：第 (3,3) 格中心</text>
  <text x="52" y="768" fill="#b91c1c">框外點 (44,28)：第 (5,3) 格中心，r 為負</text>
 </g>
 <text x="24" y="38" font-family="sans-serif" font-size="20" fill="#0f172a">64×64 輸入影像，stride 8：1 格＝8 畫素；刻度是畫素座標</text>
</svg>
