<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 474" role="img" aria-labelledby="title desc">
 <title id="title">原圖與 64×64 letterbox 輸入的座標往返</title>
 <desc id="desc">按比例繪製：每 1 畫素畫成 2.5 個單位。左邊是寬 80、高 40 的原圖，紅色是物件，綠框是它的真值框 [10,5,50,25]，單位是畫素。箭頭右邊是 64×64 的輸入：原圖等比例乘 0.8，縮成寬 64、高 32 的深色長條；上下各補邊 16 畫素，畫成灰色帶，右側尺寸線依序標出補邊 16、縮放後的原圖高 32、補邊 16。框跟著變成 [8,20,40,36]。去程是四個數全部乘 0.8，y 再加 16；回程先把 y 減 16，再把四個數全部除以 0.8，回到原框。灰色只是為了標出補邊範圍，程式實際補 0，也就是黑色。同一張圖的比例與補邊量要一起記下，才能還原。</desc>
 <rect width="630" height="474" fill="#f8fafc"/>
 <!-- 原圖：原圖座標 (x,y) 畫在 (24+2.5x, 90+2.5y)。 -->
 <rect x="24" y="90" width="200" height="100" fill="#0f172a"/>
 <rect x="49" y="102.5" width="100" height="50" fill="#ef4444"/>
 <rect x="49" y="102.5" width="100" height="50" fill="none" stroke="#4ade80" stroke-width="3"/>
 <!-- 輸入：畫布座標 (x,y) 畫在 (300+2.5x, 60+2.5y)。 -->
 <rect x="300" y="60" width="160" height="40" fill="#cbd5e1"/>
 <rect x="300" y="100" width="160" height="80" fill="#0f172a"/>
 <rect x="300" y="180" width="160" height="40" fill="#cbd5e1"/>
 <rect x="300" y="60" width="160" height="160" fill="none" stroke="#64748b" stroke-width="1.5"/>
 <rect x="320" y="110" width="80" height="40" fill="#ef4444"/>
 <rect x="320" y="110" width="80" height="40" fill="none" stroke="#4ade80" stroke-width="3"/>
 <!-- 右側尺寸線：0、16、48、64。 -->
 <path d="M474 60V220M467 60H481M467 100H481M467 180H481M467 220H481" fill="none" stroke="#475569" stroke-width="1.5"/>
 <!-- 去程與回程箭頭。 -->
 <g fill="none" stroke="#334155" stroke-width="3">
  <path d="M236 128H286M277 121L287 128L277 135"/>
  <path d="M288 152H238M247 145L237 152L247 159"/>
 </g>
 <!-- 圖例色塊：紅色與綠框畫在深色底上，和圖中一樣。 -->
 <g fill="#0f172a">
  <rect x="24" y="348" width="28" height="28" rx="3"/>
  <rect x="190" y="348" width="28" height="28" rx="3"/>
 </g>
 <rect x="29" y="353" width="18" height="18" fill="#ef4444"/>
 <rect x="195.5" y="353.5" width="17" height="17" fill="none" stroke="#4ade80" stroke-width="3"/>
 <rect x="24" y="390" width="28" height="28" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
 <g font-family="sans-serif" font-size="20" fill="#0f172a">
  <text x="24" y="76" font-size="22">原圖：寬 80、高 40</text>
  <text x="300" y="42" font-size="22">輸入 64×64</text>
  <text x="24" y="220">框 [10,5,50,25] 畫素</text>
  <text x="300" y="250">框 [8,20,40,36] 畫素</text>
  <text x="262" y="112" font-size="18" text-anchor="middle">去程</text>
  <text x="262" y="185" font-size="18" text-anchor="middle">回程</text>
  <text x="490" y="87">補邊 16</text>
  <text x="490" y="132">縮放後的原圖</text>
  <text x="490" y="161">寬 64、高 32</text>
  <text x="490" y="207">補邊 16</text>
  <text x="24" y="296">去程：全部乘 0.8，y 再加 16</text>
  <text x="24" y="328">回程：y 先減 16，再全部除以 0.8</text>
  <text x="62" y="369">紅色：物件</text>
  <text x="228" y="369">綠框：真值框，跟著圖一起轉換</text>
  <text x="62" y="411">灰色：只是標出補邊範圍，程式實際補 0（黑色）</text>
  <text x="24" y="452">同一張圖的比例與補邊量要一起記下，才能還原。</text>
 </g>
</svg>
