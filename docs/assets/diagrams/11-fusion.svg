<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" role="img" aria-labelledby="title desc">
<title id="title">本節的四步融合：深層在上，top-down 向下</title>
<desc id="desc">只畫本節 Fusion.forward 實際計算的路徑。上方 Deep 是隨機輸入 [1,16,4,4]，經第一步 1×1 reduce 得 [1,8,4,4]，第二步 nearest 上取樣得 [1,8,8,8]；藍色 top-down 箭頭由上向下。下方 Shallow 是另一個隨機輸入 [1,8,8,8]，沿綠色 lateral 橫向線直接接入第三步 concat，與上取樣輸出串接成 [1,16,8,8]。第四步 3×3 mix 輸出 [1,8,8,8] 的融合特徵。框的圖面大小不表示特徵圖大小。此圖不畫本節沒有執行的 backbone、head 或 PAN bottom-up。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
</defs>
<rect width="420" height="680" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#172033">
<text x="16" y="32" font-size="22">本節程式：一次深→淺融合</text>
<g stroke="#64748b" stroke-width="2">
<rect x="202" y="62" width="202" height="72" rx="8" fill="#dbeafe"/>
<rect x="202" y="166" width="202" height="72" rx="8" fill="white"/>
<rect x="202" y="270" width="202" height="72" rx="8" fill="white"/>
<rect x="16" y="376" width="166" height="72" rx="8" fill="#dcfce7"/>
<rect x="202" y="376" width="202" height="72" rx="8" fill="#e0f2fe"/>
<rect x="202" y="480" width="202" height="72" rx="8" fill="white"/>
<rect x="202" y="584" width="202" height="72" rx="8" fill="#e0f2fe"/>
</g>
<g text-anchor="middle" font-size="20">
<text x="303" y="89">Deep：深、粗</text><text x="303" y="120">[1,16,4,4]</text>
<text x="303" y="193">1. 1×1 reduce</text><text x="303" y="224">[1,8,4,4]</text>
<text x="303" y="297">2. nearest</text><text x="303" y="328">[1,8,8,8]</text>
<text x="99" y="403">Shallow：淺、細</text><text x="99" y="434">[1,8,8,8]</text>
<text x="303" y="403">3. concat：8+8ch</text><text x="303" y="434">[1,16,8,8]</text>
<text x="303" y="507">4. 3×3 mix</text><text x="303" y="538">16→8 channel</text>
<text x="303" y="611">融合特徵</text><text x="303" y="642">[1,8,8,8]</text>
</g>
<g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"><path d="M303 134V166"/><path d="M303 238V270"/><path d="M303 342V376"/><path d="M303 448V480"/><path d="M303 552V584"/></g>
<path d="M182 412H202" stroke="#15803d" stroke-width="3" marker-end="url(#green)"/>
<g font-size="19">
<text x="16" y="90">塔頂：4×4</text>
<text x="16" y="168" fill="#1d4ed8">top-down</text><text x="16" y="195" fill="#1d4ed8">深→淺，向下</text>
<path d="M91 210V294" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
<text x="16" y="324" fill="#15803d">lateral：橫向</text><text x="16" y="352" fill="#15803d">同一個 8×8 網格</text>
<text x="16" y="485">塔底：8×8</text>
<text x="16" y="551" fill="#475569">輸入是隨機張量。</text><text x="16" y="581" fill="#475569">本節沒有執行</text><text x="16" y="611" fill="#475569">backbone、head</text><text x="16" y="641" fill="#475569">或 PAN 回程。</text>
</g>
</g></svg>
