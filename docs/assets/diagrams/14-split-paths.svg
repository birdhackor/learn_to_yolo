<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" aria-labelledby="title desc">
  <title id="title">保留 a、b、b1、b2 四份特徵，串接後再融合</title>
  <desc id="desc">示意圖，方框大小不代表運算量。8 個 channel 的輸入先經 1×1 投影（8→8），再沿 channel 切成 a、b，各 4 個 channel。a 直接送去串接。b 同時送去串接與 bottleneck 1，bottleneck 1 輸出 b1＝b+F₁(b)；b1 同時送去串接與 bottleneck 2，bottleneck 2 輸出 b2＝b1+F₂(b1)；b2 送去串接。進入串接框的四條線由上到下是 a、b、b1、b2，依序占串接後的第 0–3、4–7、8–11、12–15 個 channel；串接框畫成等高的四段，每段 4 個 channel，4 份 × 4 個 channel 共 16 個。這 16 個 channel 再經 1×1 融合（16→8），輸出 8 個 channel。圖中 ch 是 channel 的縮寫，F₁、F₂ 是第 1、2 個 bottleneck 的 F。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="548" fill="#f8fafc"/>
  <!-- 四條入線的高度：a 131、b 225、b1 319、b2 413；串接框每段高 94。 -->
  <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
    <rect x="16" y="106" width="112" height="144" rx="8"/>
    <rect x="148" y="250" width="128" height="58" rx="8"/>
    <rect x="148" y="344" width="128" height="58" rx="8"/>
    <rect x="346" y="84" width="112" height="376" rx="8"/>
    <rect x="518" y="236" width="108" height="72" rx="8"/>
  </g>
  <path d="M346 178H458M346 272H458M346 366H458" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M128 131H343"/>
    <path d="M128 225H343"/>
    <path d="M212 225V247"/>
    <path d="M212 308V319H343"/>
    <path d="M212 319V341"/>
    <path d="M212 402V413H343"/>
    <path d="M458 272H515"/>
    <path d="M626 272H655"/>
  </g>
  <g fill="#334155">
    <circle cx="212" cy="225" r="4.5"/>
    <circle cx="212" cy="319" r="4.5"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#0f172a">
    <text x="16" y="34" font-size="21" font-weight="700">SplitAggregate：4 條保留路徑，每條 4 個 channel</text>
    <g text-anchor="middle">
      <text x="72" y="158">1×1 投影</text>
      <text x="72" y="186">8→8</text>
      <text x="72" y="214">切成 a、b</text>
      <text x="212" y="272" font-size="17" fill="#334155">bottleneck 1</text>
      <text x="212" y="297">b+F₁(b)</text>
      <text x="212" y="366" font-size="17" fill="#334155">bottleneck 2</text>
      <text x="212" y="391">b1+F₂(b1)</text>
      <text x="402" y="70">串接（concat）</text>
      <text x="402" y="138">ch 0–3</text>
      <text x="402" y="232">ch 4–7</text>
      <text x="402" y="326">ch 8–11</text>
      <text x="402" y="420">ch 12–15</text>
      <text x="402" y="490">4 份 × 4ch = 16ch</text>
      <text x="487" y="258">16ch</text>
      <text x="572" y="265">1×1 融合</text>
      <text x="572" y="293">16→8</text>
    </g>
    <text x="300" y="120">a</text>
    <text x="300" y="214">b</text>
    <text x="300" y="308">b1</text>
    <text x="300" y="402">b2</text>
    <text x="664" y="265">輸出</text>
    <text x="664" y="293">8ch</text>
    <text x="16" y="530" font-size="18" fill="#334155">ch 0–3 指串接後的第 0–3 個 channel，其餘依此類推。</text>
  </g>
</svg>
