<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 805 328" role="img" aria-labelledby="title desc">
<title id="title">保留a b b1 b2後串接融合的路徑</title><desc id="desc">8通道先投影再分4與4。a、b直接留下，b依次經兩個殘差小塊得到b1與b2；四路各4通道串接成16，再融合成8。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#172554;font-size:18px}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.node{fill:#eff6ff;stroke:#2563eb;stroke-width:2}</style>
<rect width="805" height="328" fill="white"/><text x="25" y="28" font-weight="bold">SplitAggregate：4条保留路徑，每条4 channels</text>
<rect class="node" x="25" y="120" width="135" height="65"/><text x="40" y="148">project 8→8</text><text x="48" y="174">切成a、b</text>
<path class="line" d="M160 140H210V75H590"/><text x="222" y="63">a（直接保留4ch）</text>
<path class="line" d="M160 163H235"/><text x="204" y="190">b</text>
<rect class="node" x="240" y="139" width="120" height="48"/><text x="251" y="170">b+F₁(b)</text>
<path class="line" d="M360 163H400"/><text x="373" y="192">b1</text>
<rect class="node" x="405" y="139" width="130" height="48"/><text x="414" y="170">b1+F₂(b1)</text>
<path class="line" d="M535 163H590"/><text x="548" y="193">b2</text>
<path class="line" d="M221 163V240H590"/><text x="320" y="263">保留 b（4ch）</text>
<path class="line" d="M380 163V115H590"/><text x="427" y="107">保留 b1（4ch）</text>
<rect class="node" x="600" y="61" width="108" height="202"/><text x="616" y="105">concat</text><text x="614" y="150">4×4=16ch</text><text x="614" y="196">fuse 16→8</text>
<path class="line" d="M708 162H770"/><text x="748" y="194">8ch</text>
<text x="25" y="304">串接槽順序：a、b、b1、b2；入線高度不代表槽順序</text></svg>
