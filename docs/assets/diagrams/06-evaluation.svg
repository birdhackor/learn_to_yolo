<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" role="img" aria-labelledby="title desc">
 <title id="title">四筆人工預測的PR點與all-points AP面積</title>
 <desc id="desc">順序FP TP FP TP，三個真值。PR點為0,0；三分之一,二分之一；三分之一,三分之一；三分之二,二分之一。Precision右側最大值包絡在recall零到三分之二為二分之一，AP面積為三分之一。</desc>
 <rect width="850" height="400" fill="#f8fafc"/>
 <rect x="80" y="180" width="266.67" height="140" fill="#bae6fd"/>
 <path d="M80 40V320H480" fill="none" stroke="#334155" stroke-width="3"/>
 <path d="M80 180H346.67V320H480" fill="none" stroke="#0284c7" stroke-width="4"/>
 <g fill="#f97316"><circle cx="80" cy="320" r="5"/><circle cx="213.33" cy="180" r="6"/><circle cx="213.33" cy="226.67" r="6"/><circle cx="346.67" cy="180" r="6"/></g>
 <g font-family="sans-serif" font-size="22" fill="#0f172a">
  <text x="20" y="37">Precision</text><text x="407" y="369">Recall</text>
  <text x="40" y="326">0</text><text x="34" y="187">0.5</text><text x="44" y="51">1</text>
  <text x="72" y="350">0</text><text x="195" y="350">1/3</text><text x="329" y="350">2/3</text><text x="472" y="350">1</text>
  <text x="520" y="85">橘點：依score逐筆累積</text>
  <text x="520" y="133">藍線：右側最大precision</text>
  <text x="520" y="198">面積＝(2/3)×(1/2)</text>
  <text x="520" y="240">AP50＝1/3 ≈ 0.3333</text>
  <text x="520" y="299">GT只可匹配一次</text>
  <text x="80" y="392">人工排序：0.95 FP → 0.90 TP → 0.80 duplicate FP → 0.70 TP</text>
 </g>
</svg>
