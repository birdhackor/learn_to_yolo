<svg xmlns="http://www.w3.org/2000/svg" width="480" height="588" viewBox="0 0 480 588" role="img" aria-labelledby="title desc">
<title id="title">patch之間的內容讀取</title><desc id="desc">手工資料流示意。來源小圖取實際train圖3的patch1、6、7、10。四条箭頭都表示來源V按讀取比例送到接收patch6；沒有畫實測權重，真正模型讀全部17个tokens。</desc>
