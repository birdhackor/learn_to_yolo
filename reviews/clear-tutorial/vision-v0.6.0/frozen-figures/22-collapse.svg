<svg xmlns="http://www.w3.org/2000/svg" width="520" height="780" viewBox="0 0 520 780" role="img" aria-labelledby="title desc">
<title id="title">同圖一致仍可能全部塌縮：手工二維向量例子</title><desc id="desc">上方紅圖兩個view輸出1,0，藍圖兩個view輸出0,1；下方四個view全部輸出1,0。兩種同圖平方差都為0，只有下方跨圖片的標準差為0。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#536476" stroke-width="1.5"/></marker></defs>
<rect width="520" height="780" rx="16" fill="#f7f9fc"/>
<g font-family="sans-serif" font-size="24" fill="#152c43">
<text x="24" y="38" font-size="27" font-weight="700">一致，不代表保留差異</text>
<text x="24" y="74">手工例子；不是訓練結果</text>
<rect x="20" y="100" width="480" height="286" rx="14" fill="#edf7f1" stroke="#27805b" stroke-width="2"/>
<text x="40" y="138" font-weight="700">① 同圖相同，不同圖有差異</text>
<text x="42" y="194">A</text><rect x="88" y="162" width="48" height="43" fill="#d64545"/><rect x="161" y="162" width="48" height="43" fill="#d64545"/>
<path d="M226 184H281" stroke="#536476" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="193">[1,0] [1,0]</text>
<text x="42" y="270">B</text><rect x="88" y="238" width="48" height="43" fill="#397bdd"/><rect x="161" y="238" width="48" height="43" fill="#397bdd"/>
<path d="M226 260H281" stroke="#536476" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="269">[0,1] [0,1]</text>
<text x="42" y="321">每列：兩個 view → 兩個向量</text>
<text x="42" y="360">同圖平方差加總 = 0</text>
<rect x="20" y="412" width="480" height="286" rx="14" fill="#fff2ec" stroke="#b76536" stroke-width="2"/>
<text x="40" y="450" font-weight="700">② 任何圖都回答同一向量</text>
<text x="42" y="506">A</text><rect x="88" y="474" width="48" height="43" fill="#d64545"/><rect x="161" y="474" width="48" height="43" fill="#d64545"/>
<path d="M226 496H281" stroke="#536476" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="505">[1,0] [1,0]</text>
<text x="42" y="582">B</text><rect x="88" y="550" width="48" height="43" fill="#397bdd"/><rect x="161" y="550" width="48" height="43" fill="#397bdd"/>
<path d="M226 572H281" stroke="#536476" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="581">[1,0] [1,0]</text>
<text x="42" y="633">同圖平方差加總 = 0</text>
<text x="42" y="673">跨圖片特徵標準差 = 0</text>
<text x="24" y="740">只檢查同圖 loss，分不出①和②。</text>
</g></svg>
