<svg xmlns="http://www.w3.org/2000/svg" width="520" height="850" viewBox="0 0 520 850" role="img" aria-labelledby="title desc"><title id="title">實際test query與兩套特徵選出的最近鄰</title><desc id="desc">test0藍矩形，SSL特徵選train59，random特徵選train64；兩張參考圖皆為藍色。</desc><!-- Actual 22-features.json neighbor indices; pixels recreated from seeds101/303 and split sample counts128/64. --><rect width="520" height="850" rx="16" fill="#f7f9fc"/><g font-family="Noto Sans CJK TC, sans-serif" font-size="24" fill="#152c43"><text x="24" y="38" font-size="27" fill="#152c43" font-weight="bold">同一 query，兩份參考庫</text><text x="24" y="76" font-size="24" fill="#152c43" font-weight="normal">實際圖片；只從 train 借答案</text><text x="159" y="114" font-size="24" fill="#152c43" font-weight="normal">test 0：藍</text><image x="164" y="138" width="192" height="192" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="30" y="374" font-size="23" fill="#152c43" font-weight="normal">先取 CLS，再用 cosine 找最像的圖</text><image x="38" y="420" width="190" height="190" href="data:image/png;base64," style="image-rendering:pixelated"/><image x="292" y="420" width="190" height="190" href="data:image/png;base64," style="image-rendering:pixelated"/><text x="52" y="653" font-size="24" fill="#152c43" font-weight="normal">SSL → train 59</text><text x="304" y="653" font-size="24" fill="#152c43" font-weight="normal">random → 64</text><text x="91" y="694" font-size="24" fill="#152c43" font-weight="normal">藍色</text><text x="348" y="694" font-size="24" fill="#152c43" font-weight="normal">藍色</text><text x="30" y="752" font-size="24" fill="#152c43" font-weight="normal">此 query 兩者皆答對。</text><text x="30" y="794" font-size="23" fill="#152c43" font-weight="normal">test 共64張：兩者 1-NN 皆64/64。</text></g></svg>
