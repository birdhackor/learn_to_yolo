<svg xmlns="http://www.w3.org/2000/svg" width="480" height="940" viewBox="0 0 480 940" role="img" aria-labelledby="title desc">
<title id="title">完整Pre-LayerNorm Transformer block</title><desc id="desc">手工資料流。兩條shortcut不經LN，分別將輸入X與第一段结果U送到加號。attention交換token資訊，MLP只組合每個token的特徵。</desc>
