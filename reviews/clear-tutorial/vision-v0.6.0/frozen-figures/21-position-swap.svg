<svg xmlns="http://www.w3.org/2000/svg" width="480" height="664" viewBox="0 0 480 664" role="img" aria-labelledby="title desc">
<title id="title">交換patch內容而保持位置在原槽</title><desc id="desc">手工示意，不是實測特徵。槽位1和16的位置向量保持原位。無位置時是同一批內容重排；有位置時內容加位置配對改變。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs>
<style>text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#172554;font-size:24px} .small{font-size:22px}.head{font-size:28px;font-weight:700}.line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)} image{image-rendering:pixelated}</style>
<rect width="480" height="664" rx="12" fill="#f8fafc"/>
<text x="240" y="40" text-anchor="middle" style="font-size:26px">只換內容，槽位留在原地</text>
<text x="240" y="82" text-anchor="middle" style="font-size:26px">交換前</text>
<rect x="20" y="100" width="200" height="76" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="120.0" y="130.0" text-anchor="middle" style="font-size:22px">槽 1</text>
<text x="120.0" y="162.0" text-anchor="middle" style="font-size:22px">內容 A ＋ 位置 1</text>
<rect x="260" y="100" width="200" height="76" rx="10" fill="#fce7f3" stroke="#64748b" stroke-width="2"/>
<text x="360.0" y="130.0" text-anchor="middle" style="font-size:22px">槽 16</text>
<text x="360.0" y="162.0" text-anchor="middle" style="font-size:22px">內容 B ＋ 位置 16</text>
<path d="M110 186 L370 262" class="line"/>
<path d="M370 186 L110 262" class="line"/>
<text x="240" y="246" text-anchor="middle" style="font-size:22px">A、B 內容交換</text>
<text x="240" y="298" text-anchor="middle" style="font-size:26px">交換後</text>
<rect x="20" y="316" width="200" height="76" rx="10" fill="#fce7f3" stroke="#64748b" stroke-width="2"/>
<text x="120.0" y="346.0" text-anchor="middle" style="font-size:22px">槽 1</text>
<text x="120.0" y="378.0" text-anchor="middle" style="font-size:22px">內容 B ＋ 位置 1</text>
<rect x="260" y="316" width="200" height="76" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
<text x="360.0" y="346.0" text-anchor="middle" style="font-size:22px">槽 16</text>
<text x="360.0" y="378.0" text-anchor="middle" style="font-size:22px">內容 A ＋ 位置 16</text>
<rect x="24" y="438" width="432" height="74" rx="10" fill="#dcfce7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="467.0" text-anchor="middle" style="font-size:24px">無位置：同一批內容重排</text>
<text x="240.0" y="499.0" text-anchor="middle" style="font-size:24px">CLS 不變（容許捨入誤差）</text>
<rect x="24" y="536" width="432" height="74" rx="10" fill="#fef3c7" stroke="#64748b" stroke-width="2"/>
<text x="240.0" y="565.0" text-anchor="middle" style="font-size:24px">位置固定：配對改變</text>
<text x="240.0" y="597.0" text-anchor="middle" style="font-size:24px">CLS 可能改變</text>
<text x="240" y="650" text-anchor="middle" style="font-size:22px">手工示意 · CLS 始終在第 0 槽</text>
</svg>
