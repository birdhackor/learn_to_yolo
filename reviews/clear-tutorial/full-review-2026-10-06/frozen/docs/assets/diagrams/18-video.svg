<text x="15" y="272" fill="white" font-family="sans-serif" font-size="19">處理 2.28 ms｜框 1 個</text>
<image x="330" y="20" width="288" height="192" href="data:image/png;base64,"/>
<text x="330" y="242" fill="white" font-family="sans-serif" font-size="21">第 5 幀：來源時間 0.25 秒</text>
<text x="330" y="272" fill="white" font-family="sans-serif" font-size="19">處理 0.91 ms｜框 0 個</text>
<image x="645" y="20" width="288" height="192" href="data:image/png;base64,"/>
<text x="645" y="242" fill="white" font-family="sans-serif" font-size="21">第 11 幀：來源時間 0.55 秒</text>
<text x="645" y="272" fill="white" font-family="sans-serif" font-size="19">處理 0.91 ms｜框 0 個</text>
