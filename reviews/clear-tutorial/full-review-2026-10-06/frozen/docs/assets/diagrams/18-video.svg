<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="t d">
<title id="t">移動畫面的實際偵測結果：12 幀，來源每秒 20 幀</title>
<desc id="d">三格依序是這次執行產生的第一、中間與最後一幀（第 0、5、11 幀）的 RGB 畫面。黃框是模型的預測，框上的數字是 score；每格下方寫來源時間、這一幀的處理時間與框數。預測框不是真值。</desc>
<rect width="960" height="290" fill="#0f172a"/>
