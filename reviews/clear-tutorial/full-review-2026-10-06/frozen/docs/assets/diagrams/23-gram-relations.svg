<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="540" viewBox="0 0 520 540" role="img" aria-labelledby="title desc"><title id="title">三個 patch 的 Gram 關係</title><desc id="desc">三個長度為一的特徵 A、B、C 兩兩內積。列與欄代表同一組 patch，對角線為一，A 和 B 相似度零，A 或 B 和 C 相似度約零點七零七一。</desc><rect width="520" height="540" fill="#f8fafc"/><g font-family="sans-serif" fill="#172554" font-size="24"><text x="24" y="38">已正規化的 patch 特徵</text><text x="24" y="82">A = [1, 0]　B = [0, 1]</text><text x="24" y="122">C ≈ [0.7071, 0.7071]</text><text x="24" y="173">兩兩內積 → Gram 關係表</text><text x="146" y="216" text-anchor="middle">A</text><text x="258" y="216" text-anchor="middle">B</text><text x="370" y="216" text-anchor="middle">C</text><text x="54" y="263" text-anchor="middle">A</text><rect x="90" y="233" width="112" height="65" fill="#dbeafe" stroke="#94a3b8"/><text x="146" y="273" text-anchor="middle">1</text><rect x="202" y="233" width="112" height="65" fill="#f1f5f9" stroke="#94a3b8"/><text x="258" y="273" text-anchor="middle">0</text><rect x="314" y="233" width="112" height="65" fill="#d1fae5" stroke="#94a3b8"/><text x="370" y="273" text-anchor="middle">0.7071</text><text x="54" y="328" text-anchor="middle">B</text><rect x="90" y="298" width="112" height="65" fill="#f1f5f9" stroke="#94a3b8"/><text x="146" y="338" text-anchor="middle">0</text><rect x="202" y="298" width="112" height="65" fill="#dbeafe" stroke="#94a3b8"/><text x="258" y="338" text-anchor="middle">1</text><rect x="314" y="298" width="112" height="65" fill="#d1fae5" stroke="#94a3b8"/><text x="370" y="338" text-anchor="middle">0.7071</text><text x="54" y="393" text-anchor="middle">C</text><rect x="90" y="363" width="112" height="65" fill="#d1fae5" stroke="#94a3b8"/><text x="146" y="403" text-anchor="middle">0.7071</text><rect x="202" y="363" width="112" height="65" fill="#d1fae5" stroke="#94a3b8"/><text x="258" y="403" text-anchor="middle">0.7071</text><rect x="314" y="363" width="112" height="65" fill="#dbeafe" stroke="#94a3b8"/><text x="370" y="403" text-anchor="middle">1</text><text x="24" y="474">一起旋轉：向量變，夾角不變。</text><text x="24" y="514">全改一樣：每格都變成 1。</text></g></svg>