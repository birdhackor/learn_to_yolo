<title id="title">示意：fine 的責任格</title>
<desc id="desc">示意圖，非預測結果。兩圖使用相同64×64輸入，紅框xyxy=[5,5,13,13]、藍框=[32,32,56,56]，pixel單位。fine有8×8格，正格(1, 1)只負責小框，另一物件中心所在的(5, 5)仍為負格，以斜線強調；所有白格也為負格。x向右、y向下，格編號從0起算。</desc>
