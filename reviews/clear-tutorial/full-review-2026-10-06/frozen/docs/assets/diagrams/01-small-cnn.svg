<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="title desc">
<title id="title">三步後的小CNN前四張結果，全猜藍色</title><desc id="desc">依lesson_cases/01-small-cnn.py實際生成圖片和保存的seed7、SGD學習率0.1三步執行紀錄重畫。32乘32黑圖每畫素3單位，矩形12乘12，位置由make_batch決定。圖0與2紅色GT0卻猜1，圖1與3藍色GT1猜1。紅標題代表分類錯誤，不是預測框。</desc>
<rect width="520" height="560" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="22" y="34" font-size="24">更新 3 步後：模型全猜藍色</text>
<text x="22" y="72" font-size="24" fill="#b91c1c">圖 0：錯誤</text>
<rect x="22" y="90" width="96" height="96" fill="#000"/>
<rect x="34" y="108" width="36" height="36" fill="#f00"/>
<text x="131" y="123" font-size="23">GT = 0</text>
<text x="131" y="161" font-size="23">pred = 1</text>
<text x="274" y="72" font-size="24" fill="#0f172a">圖 1：正確</text>
<rect x="274" y="90" width="96" height="96" fill="#000"/>
<rect x="298" y="108" width="36" height="36" fill="#00f"/>
<text x="383" y="123" font-size="23">GT = 1</text>
<text x="383" y="161" font-size="23">pred = 1</text>
<text x="22" y="262" font-size="24" fill="#b91c1c">圖 2：錯誤</text>
<rect x="22" y="280" width="96" height="96" fill="#000"/>
<rect x="58" y="313" width="36" height="36" fill="#f00"/>
<text x="131" y="313" font-size="23">GT = 0</text>
<text x="131" y="351" font-size="23">pred = 1</text>
<text x="274" y="262" font-size="24" fill="#0f172a">圖 3：正確</text>
<rect x="274" y="280" width="96" height="96" fill="#000"/>
<rect x="286" y="313" width="36" height="36" fill="#00f"/>
<text x="383" y="313" font-size="23">GT = 1</text>
<text x="383" y="351" font-size="23">pred = 1</text>
<text x="22" y="474" font-size="23">GT：真值；pred：模型答案。</text>
<text x="22" y="510" font-size="23">類別 0＝紅色；類別 1＝藍色。</text>
<text x="22" y="546" font-size="21">seed 7；訓練用的圖，尚未評估新圖。</text>
</g></svg>