<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1250" viewBox="0 0 480 1250" role="img" aria-labelledby="title desc">
<title id="title">參考點決定框內資格，預測框用來計算IoU</title>
<desc id="desc">上下圖板共用比例的x數線。x座標映射為48+8x，x=0到50；主要刻度0,8,12,16,20,24,32,40,50，小刻度間隔2。所有框y從0起，所有參考點y=8，所以只畫x。GT A[0,0,20,16]類別0；B[12,0,32,16]類別1，橘色是x重疊12到20。參考點p0(8,8)在A內，p1(16,8)在A與B內，p2(24,8)在B內，p3(40,8)在兩框外。四個藍預測框分別p0[0,0,10,16]、p1[4,0,24,16]、p2[14,0,32,16]、p3[40,0,50,10]，用來與A、B算IoU。GT與p0到p2框y範圍0到16；p3框y範圍0到10。上下分行只為看清楚，長條高度不代表框高。</desc>
