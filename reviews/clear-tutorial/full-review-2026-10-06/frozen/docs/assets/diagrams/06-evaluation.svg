<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 618" role="img" aria-labelledby="title desc">
 <title id="title">四筆人工預測的 PR 點與 all-points AP 面積</title>
 <desc id="desc">按比例繪製的 PR 圖：橫軸 recall 從 0 到 1 畫成 540 單位，每 1/3 是 180 單位；縱軸 precision 從 0 到 1 畫成 360 單位，0.5 是 180 單位。四個橘點依 score 由高到低逐筆納入，座標寫成 (recall, precision)：#1 score 0.95 是 FP，在 (0, 0)；#2 score 0.90 是 TP，在 (1/3, 1/2)；#3 score 0.80 是重複框，算 FP，在 (1/3, 1/3)，因為 GT1 已被 #2 配對；#4 score 0.70 是 TP，在 (2/3, 1/2)。灰色虛線依序連起四點，畫出原始的鋸齒，不用來算面積。藍線是右側最大值包絡：recall 0 到 2/3 高 0.5；#3 旁的藍色箭頭表示包絡在 recall 1/3 處被右側的 0.5 抬高，#3 本身的 precision 仍是 1/3；recall 2/3 到 1 貼著橫軸，包絡＝0。淺藍面積＝(2/3)×0.5＝1/3，就是 AP50，約 0.3333。最下一行依人工給定的 score 由高到低列出判定：0.95 FP、0.90 TP、0.80 重複框 FP、0.70 TP。</desc>
 <rect width="720" height="618" fill="#f8fafc"/>
 <!-- PR 座標 (r,p) 畫在 (84+540r, 416-360p)。 -->
 <rect x="84" y="236" width="360" height="180" fill="#bae6fd"/>
 <path d="M84 56V416H624M78 56H84M78 236H84M264 416V422M444 416V422M624 416V422" fill="none" stroke="#334155" stroke-width="3"/>
 <path d="M84 236H444V416H624" fill="none" stroke="#0284c7" stroke-width="4"/>
 <path d="M84 416L264 236L264 296L444 236" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
 <!-- #3 被右側 0.5 抬高的箭頭。 -->
 <path d="M286 282V252" fill="none" stroke="#0284c7" stroke-width="2.5"/>
 <path d="M279 254L286 243L293 254Z" fill="#0284c7"/>
 <g fill="#f97316" stroke="#f8fafc" stroke-width="2">
  <circle cx="84" cy="416" r="7"/><circle cx="264" cy="236" r="7"/><circle cx="264" cy="296" r="7"/><circle cx="444" cy="236" r="7"/>
 </g>
 <!-- 圖例符號。 -->
 <circle cx="38" cy="487" r="7" fill="#f97316"/>
 <path d="M24 521H52" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
 <path d="M24 555H52" stroke="#0284c7" stroke-width="4"/>
 <rect x="380" y="476" width="24" height="22" fill="#bae6fd"/>
 <g font-family="sans-serif" font-size="20" fill="#0f172a">
  <text x="84" y="34" text-anchor="middle">Precision</text>
  <text x="638" y="423">Recall</text>
  <g text-anchor="end"><text x="70" y="63">1</text><text x="70" y="243">0.5</text><text x="70" y="423">0</text></g>
  <g text-anchor="middle"><text x="84" y="450">0</text><text x="264" y="450">1/3</text><text x="444" y="450">2/3</text><text x="624" y="450">1</text></g>
  <text x="120" y="406">#1 0.95 FP</text>
  <text x="264" y="216" text-anchor="middle">#2 0.90 TP</text>
  <text x="200" y="330">#3 0.80 重複框 FP</text>
  <text x="444" y="216" text-anchor="middle">#4 0.70 TP</text>
  <text x="200" y="361" fill="#075985">被右側 0.5 抬高</text>
  <text x="534" y="404" text-anchor="middle" fill="#075985">包絡＝0</text>
  <text x="62" y="494">橘點：逐筆納入後的 PR 點</text>
  <text x="62" y="528">灰虛線：原始鋸齒，不用來算面積</text>
  <text x="62" y="562">藍線：右側最大值包絡</text>
  <text x="414" y="494">淺藍面積＝(2/3)×0.5</text>
  <text x="414" y="528">AP50＝1/3 ≈ 0.3333</text>
  <text x="414" y="562">#3：GT1 已被 #2 配對</text>
  <text x="24" y="600">依人工 score 排序：0.95 FP → 0.90 TP → 0.80 重複框 FP → 0.70 TP</text>
 </g>
</svg>
