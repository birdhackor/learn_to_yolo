<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" role="img" aria-labelledby="title desc">
 <title id="title">Letterbox 與框還原</title>
 <desc id="desc">按比例繪製：左邊原圖每 1 畫素畫成 2.5 個單位，右邊輸入每 1 畫素畫成 4 個單位，兩邊比例不同，大小不能直接互相比較；圖例列右側也註明「左右兩邊的放大倍率不同」。左邊是寬 120、高 80 的原圖，黑底上的紅色矩形是紅框 [20,10,60,30]，單位是畫素。箭頭右邊整個正方形是 64×64 的輸入：原圖縮成寬 64、高 43 的深色有效圖，上方 padding 10、下方 padding 11，畫成灰色帶；紅框跟著變成約 [10.67,15.375,32,26.125]。灰色只標出 padding 範圍，程式實際補 0，也就是黑色。還原時先減掉左、上 padding（本例左 padding 是 0，y 減上方的 10），再把 x 除以 sx、y 除以 sy，其中 sx=64/120、sy=43/80。</desc>
 <rect width="640" height="466" fill="#f8fafc"/>
 <!-- 原圖：原圖座標 (x,y) 畫在 (16+2.5x, 56+2.5y)。 -->
 <rect x="16" y="56" width="300" height="200" fill="#0f172a"/>
 <rect x="66" y="81" width="100" height="50" fill="#ef4444"/>
 <!-- 輸入：輸入座標 (x,y) 畫在 (368+4x, 56+4y)。y 0～10 是上 padding，10～53 是有效圖，53～64 是下 padding。 -->
 <rect x="368" y="56" width="256" height="40" fill="#cbd5e1"/>
 <rect x="368" y="96" width="256" height="172" fill="#0f172a"/>
 <rect x="368" y="268" width="256" height="44" fill="#cbd5e1"/>
 <rect x="368" y="56" width="256" height="256" fill="none" stroke="#64748b" stroke-width="1.5"/>
 <rect x="410.667" y="117.5" width="85.333" height="43" fill="#ef4444"/>
 <!-- 原圖到輸入的箭頭。 -->
 <path d="M326 156H356M347 149L357 156L347 163" fill="none" stroke="#334155" stroke-width="3"/>
 <!-- 圖例色塊。 -->
 <rect x="16" y="399" width="22" height="22" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
 <g font-family="sans-serif" font-size="18" fill="#0f172a">
  <text x="16" y="40" font-size="20">原圖 寬 120×高 80</text>
  <text x="368" y="40" font-size="20">輸入 64×64</text>
  <text x="66" y="156" font-size="16" fill="#fca5a5">框 [20,10,60,30]</text>
  <text x="376" y="185.5" font-size="16" fill="#fca5a5">框 [10.67,15.375,32,26.125]</text>
  <g text-anchor="middle">
   <text x="496" y="82.5">上 padding 10</text>
   <text x="496" y="252" fill="#f8fafc">有效圖 寬 64×高 43</text>
   <text x="496" y="296.5">下 padding 11</text>
  </g>
  <!-- 還原說明拆成兩行；第二行縮排對齊「還原：」之後的字。 -->
  <text><tspan x="16" y="350">還原：減掉左、上 padding（本例 y 減 10），</tspan><tspan x="70" y="377">x 除以 sx、y 除以 sy（sx=64/120、sy=43/80）</tspan></text>
  <!-- 圖例列：左邊是灰色色塊的說明（兩行），右邊短註對齊輸入那一欄。 -->
  <text><tspan x="48" y="417">灰色：只標出 padding 範圍，</tspan><tspan x="48" y="444">程式實際補 0（黑色）</tspan></text>
  <!-- 短註：左邊每 1 畫素畫成 2.5 個單位，右邊每 1 畫素畫成 4 個單位。 -->
  <text x="368" y="417">左右兩邊的放大倍率不同</text>
 </g>
</svg>
