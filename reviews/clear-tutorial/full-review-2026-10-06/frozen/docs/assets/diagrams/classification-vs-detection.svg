<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 550" role="img" aria-labelledby="title desc">
  <title id="title">同一張圖片，分類與偵測要回答不同的問題</title>
  <desc id="desc">兩個例子都用黑底紅色方塊。分類只回答紅色；偵測還要提供框的位置。這是任務答案的示意，不是模型預測。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker>
  </defs>
  <rect width="520" height="550" rx="16" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="24" y="42" font-size="24" font-weight="700">分類：整張圖是哪一類？</text>
    <rect x="28" y="70" width="160" height="160" rx="4" fill="#111827"/>
    <rect x="48" y="100" width="40" height="40" fill="#ef4444"/>
    <path d="M210,148 H267" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="290" y="106" width="200" height="86" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="312" y="141" font-size="22">答案</text>
    <text x="312" y="174" font-size="26" font-weight="700">紅色</text>
    <path d="M24,260 H496" stroke="#cbd5e1" stroke-width="2"/>
    <text x="24" y="302" font-size="24" font-weight="700">偵測：是哪一類？在哪裡？</text>
    <rect x="28" y="330" width="160" height="160" rx="4" fill="#111827"/>
    <rect x="48" y="360" width="40" height="40" fill="#ef4444"/>
    <path d="M210,408 H267" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="290" y="330" width="160" height="160" rx="4" fill="#111827"/>
    <rect x="310" y="360" width="40" height="40" fill="#ef4444"/>
    <rect x="310" y="360" width="40" height="40" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <text x="310" y="352" font-size="22" font-weight="700" fill="#7dd3fc">紅色</text>
    <text x="24" y="528" font-size="22">藍框是位置答案；兩種任務用同一張圖。</text>
  </g>
</svg>
