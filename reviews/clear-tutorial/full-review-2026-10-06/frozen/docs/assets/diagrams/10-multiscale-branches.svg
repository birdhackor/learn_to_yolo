<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 966" role="img" aria-labelledby="title desc">
<title id="title">示意：TwoScale 的特徵與預測分支</title>
<desc id="desc">示意，依lesson_cases/10-multiscale.py的TwoScale。輸入[1,3,64,64]經early得到fine_features[1,16,8,8]。它直接接fine_head產生fine_pred[1,8,8,7]，也經deep得到coarse_features[1,32,4,4]再接coarse_head產生coarse_pred[1,4,4,7]。特徵的軸為圖片、channel、列、欄；預測的軸為圖片、列、欄、七項輸出。分別配小框與大框target，兩loss相加。features和pred後綴是本頁的教學角色命名。</desc>
<!-- Source: lesson_cases/10-multiscale.py TwoScale and main(). Teaching role names; same layers and shapes; not measured AP comparison. -->
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#94a3b8" stroke-width="1.4"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="560" height="966" fill="#f8fafc"/>
<g font-family="Noto Sans CJK TC, sans-serif" fill="#0f172a"><text x="24" y="35" font-size="25" fill="#0f172a" text-anchor="start" font-weight="700">示意：同一張特徵分出兩個 head</text>
<rect x="80" y="60" width="400" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="280.0" y="88" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">輸入影像</text>
<text x="280.0" y="116" font-size="22" fill="#0f172a" text-anchor="middle">[1,3,64,64]</text>
<path d="M280 125V150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="152" width="400" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="280.0" y="180" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">early：三層 stride 2 卷積</text>
<text x="280.0" y="208" font-size="22" fill="#0f172a" text-anchor="middle">64 → 32 → 16 → 8</text>
<path d="M280 217V242" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="244" width="400" height="65" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="280.0" y="272" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">fine_features</text>
<text x="280.0" y="300" font-size="22" fill="#0f172a" text-anchor="middle">[1,16,8,8]</text>
<path d="M280 309V335H420V357" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M280 335H140V535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="128" y="450" font-size="21" fill="#0f172a" text-anchor="middle">直接接 head</text>
<rect x="310" y="359" width="220" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="420.0" y="387" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">deep</text>
<text x="420.0" y="415" font-size="22" fill="#0f172a" text-anchor="middle">再一層 stride 2</text>
<path d="M420 424V449" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="451" width="220" height="65" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="420.0" y="479" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">coarse_features</text>
<text x="420.0" y="507" font-size="22" fill="#0f172a" text-anchor="middle">[1,32,4,4]</text>
<path d="M420 516V535" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="537" width="220" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="140.0" y="565" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">fine_head</text>
<text x="140.0" y="593" font-size="22" fill="#0f172a" text-anchor="middle">1×1 卷積</text>
<rect x="310" y="537" width="220" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="420.0" y="565" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">coarse_head</text>
<text x="420.0" y="593" font-size="22" fill="#0f172a" text-anchor="middle">1×1 卷積</text>
<path d="M140 602V651" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M420 602V651" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="140" y="630" font-size="20" fill="#0f172a" text-anchor="middle">permute</text>
<text x="420" y="630" font-size="20" fill="#0f172a" text-anchor="middle">permute</text>
<rect x="30" y="653" width="220" height="92" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="140.0" y="681" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">fine_pred</text>
<text x="140.0" y="709" font-size="22" fill="#0f172a" text-anchor="middle">[1,8,8,7]</text>
<text x="140.0" y="737" font-size="22" fill="#0f172a" text-anchor="middle">64 個候選</text>
<rect x="310" y="653" width="220" height="92" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="420.0" y="681" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">coarse_pred</text>
<text x="420.0" y="709" font-size="22" fill="#0f172a" text-anchor="middle">[1,4,4,7]</text>
<text x="420.0" y="737" font-size="22" fill="#0f172a" text-anchor="middle">16 個候選</text>
<path d="M140 745V770" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M420 745V770" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="772" width="220" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="140.0" y="800" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">fine loss</text>
<text x="140.0" y="828" font-size="22" fill="#0f172a" text-anchor="middle">只配小框 target</text>
<rect x="310" y="772" width="220" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="420.0" y="800" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">coarse loss</text>
<text x="420.0" y="828" font-size="22" fill="#0f172a" text-anchor="middle">只配大框 target</text>
<path d="M140 837V858H280V878" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M420 837V858H280" fill="none" stroke="#475569" stroke-width="2"/>
<rect x="80" y="880" width="400" height="65" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" rx="9"/>
<text x="280.0" y="908" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">total = fine loss + coarse loss</text>
<text x="280.0" y="936" font-size="22" fill="#0f172a" text-anchor="middle">backward → optimizer.step()</text>
</g>
</svg>
