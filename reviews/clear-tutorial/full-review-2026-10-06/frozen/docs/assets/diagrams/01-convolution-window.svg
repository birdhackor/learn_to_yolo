<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 468" role="img" aria-labelledby="title desc">
<title id="title">卷積的局部讀取與權重共享</title><desc id="desc">示意一個channel的像素網格。實線與虛線藍框分別示意同一個3乘3卷積視窗在位置A與位置B，兩處使用同一組權重，不是兩個不同濾鏡。</desc>
