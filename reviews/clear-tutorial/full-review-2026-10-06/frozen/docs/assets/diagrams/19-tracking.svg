<text x="368" y="250" font-family="sans-serif" font-size="20">第 2 幀</text>
<rect x="426.8" y="280" width="23" height="18" fill="#dc2626"/>
<text x="368" y="276" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="411.6" y="317" width="23" height="18" fill="#2563eb"/>
<text x="368" y="313" font-family="sans-serif" font-size="17">B：ID2</text>
<rect x="530" y="225" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="538" y="250" font-family="sans-serif" font-size="20">第 3 幀</text>
<rect x="612.0" y="280" width="23" height="18" fill="#dc2626"/>
<text x="538" y="276" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="566.4" y="317" width="23" height="18" fill="#2563eb"/>
<text x="538" y="313" font-family="sans-serif" font-size="17">B：ID2</text>
<rect x="700" y="225" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="708" y="250" font-family="sans-serif" font-size="20">第 4 幀</text>
<rect x="797.2" y="280" width="23" height="18" fill="#dc2626"/>
<text x="708" y="276" font-family="sans-serif" font-size="17">A：ID1</text>
<text x="708" y="320" font-family="sans-serif" font-size="17" fill="#64748b">B：漏檢</text>
<rect x="870" y="225" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="878" y="250" font-family="sans-serif" font-size="20">第 5 幀</text>
<rect x="982.4" y="280" width="23" height="18" fill="#dc2626"/>
<text x="878" y="276" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="876.0" y="317" width="23" height="18" fill="#2563eb"/>
<text x="878" y="313" font-family="sans-serif" font-size="17">B：ID2</text>
<text x="20" y="380" font-family="sans-serif" font-size="18">方塊顏色＝分配到的 track ID；A、B 只用來評分。兩種方法吃同一份偵測框。</text>
<text x="20" y="408" font-family="sans-serif" font-size="18">水平位置是真的；A、B 分上下兩條只為了讓標籤分開，配對時兩者的 y 座標相同。</text>
</svg>
