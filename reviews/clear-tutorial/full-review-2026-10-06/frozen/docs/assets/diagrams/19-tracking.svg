<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img" aria-labelledby="t d">
<title id="t">max_age=2 時的 ID 切換：上一框法 3 次，速度預測法 0 次</title>
<desc id="d">六幀畫面，兩個真實身分 A 與 B。上列用上一框法配對，ID 切換 3 次；下列用速度預測法，ID 切換 0 次。兩者都用 max_age=2。第 4 幀漏檢 B。</desc>
<rect width="1040" height="420" fill="#f8fafc"/>
<text x="20" y="35" font-family="sans-serif" font-size="22" fill="#0f172a">上一框法（直接用上一框算 IoU）：ID 切換 3 次</text>
<rect x="20" y="55" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="28" y="80" font-family="sans-serif" font-size="20">第 0 幀</text>
<rect x="56.4" y="110" width="23" height="18" fill="#dc2626"/>
<text x="28" y="106" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="102.0" y="147" width="23" height="18" fill="#2563eb"/>
<text x="28" y="143" font-family="sans-serif" font-size="17">B：ID2</text>
<rect x="190" y="55" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="198" y="80" font-family="sans-serif" font-size="20">第 1 幀</text>
<rect x="241.6" y="110" width="23" height="18" fill="#dc2626"/>
<text x="198" y="106" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="256.8" y="147" width="23" height="18" fill="#2563eb"/>
<text x="198" y="143" font-family="sans-serif" font-size="17">B：ID2</text>
<rect x="360" y="55" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="368" y="80" font-family="sans-serif" font-size="20">第 2 幀</text>
<rect x="426.8" y="110" width="23" height="18" fill="#2563eb"/>
<text x="368" y="106" font-family="sans-serif" font-size="17">A：ID2</text>
<rect x="411.6" y="147" width="23" height="18" fill="#dc2626"/>
<text x="368" y="143" font-family="sans-serif" font-size="17">B：ID1</text>
<rect x="530" y="55" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="538" y="80" font-family="sans-serif" font-size="20">第 3 幀</text>
<rect x="612.0" y="110" width="23" height="18" fill="#2563eb"/>
<text x="538" y="106" font-family="sans-serif" font-size="17">A：ID2</text>
<rect x="566.4" y="147" width="23" height="18" fill="#dc2626"/>
<text x="538" y="143" font-family="sans-serif" font-size="17">B：ID1</text>
<rect x="700" y="55" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="708" y="80" font-family="sans-serif" font-size="20">第 4 幀</text>
<rect x="797.2" y="110" width="23" height="18" fill="#2563eb"/>
<text x="708" y="106" font-family="sans-serif" font-size="17">A：ID2</text>
<text x="708" y="150" font-family="sans-serif" font-size="17" fill="#64748b">B：漏檢</text>
<rect x="870" y="55" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="878" y="80" font-family="sans-serif" font-size="20">第 5 幀</text>
<rect x="982.4" y="110" width="23" height="18" fill="#2563eb"/>
<text x="878" y="106" font-family="sans-serif" font-size="17">A：ID2</text>
<rect x="876.0" y="147" width="23" height="18" fill="#7c3aed"/>
<text x="878" y="143" font-family="sans-serif" font-size="17">B：ID3</text>
<text x="20" y="205" font-family="sans-serif" font-size="22" fill="#0f172a">速度預測法（先預測位置再算 IoU）：ID 切換 0 次</text>
<rect x="20" y="225" width="155" height="120" fill="white" stroke="#94a3b8"/>
<text x="28" y="250" font-family="sans-serif" font-size="20">第 0 幀</text>
<rect x="56.4" y="280" width="23" height="18" fill="#dc2626"/>
<text x="28" y="276" font-family="sans-serif" font-size="17">A：ID1</text>
<rect x="102.0" y="317" width="23" height="18" fill="#2563eb"/>
