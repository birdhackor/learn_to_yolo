name: Publish Learn to YOLO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - name: Install CPU experiment dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-model.txt
      - name: Identify experiment code, inputs and runtime
        id: execution
        run: python scripts/course_execution.py key --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: outputs/lesson-execution
          key: lesson-cpu-${{ runner.os }}-${{ steps.execution.outputs.key }}
      - name: Validate or execute the complete CPU lesson bundle
        run: python scripts/course_execution.py ensure --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-execution
          path: outputs/lesson-execution
          retention-days: 30
  build:
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install website dependencies
        run: python -m pip install -r requirements-docs.txt
      - uses: actions/download-artifact@v4
        with:
          name: lesson-execution
          path: outputs/lesson-execution
      - name: Validate data manifests and notebook pairs
        run: python scripts/validate_preparation.py
      - name: Validate lesson sources, notebook pairing and figures
        run: python scripts/validate_lessons.py
      - name: Validate current lesson execution evidence
        run: python scripts/validate_curriculum_evidence.py
      - name: Build Zensical pages
        run: zensical build --clean --strict
      - name: Record source and execution versions separately
        run: python scripts/publication.py --revision "$GITHUB_SHA"
      - name: Validate generated pages and search index
        run: python scripts/validate_site.py --require-publication
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
