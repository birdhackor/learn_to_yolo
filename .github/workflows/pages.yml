name: Publish Learn to YOLO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install website dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Validate data manifests and notebook pairs
        run: python scripts/validate_preparation.py
      - name: Validate lessons and reader reviews
        run: python scripts/validate_lessons.py
      - name: Build Zensical pages
        run: zensical build --clean --strict
      - name: Validate generated pages and search index
        run: python scripts/validate_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
