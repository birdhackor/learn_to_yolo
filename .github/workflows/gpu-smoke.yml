name: GPU training and checkpoint smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-to-yolo-gpu-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODAL_TOKEN_ID: ${{ vars.MODAL_TOKEN_ID || secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT || 'main' }}
      MODAL_HF_SECRET_NAME: ${{ vars.MODAL_HF_SECRET_NAME || vars.MODAL_SECRET_NAME || vars.HF_SECRET_NAME }}
      MODAL_CHECKPOINT_VOLUME: ${{ vars.MODAL_CHECKPOINT_VOLUME || vars.MODAL_VOLUME_NAME || 'learn-to-yolo-checkpoints' }}
      HF_CHECKPOINT_REPO: ${{ vars.HF_CHECKPOINT_REPO }}
      HF_RELEASE_REPO: ${{ vars.HF_RELEASE_REPO }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-modal.txt
      - name: Install only the Modal client
        run: python -m pip install -r requirements-modal.txt
      - name: Verify client isolation
        run: python scripts/modal_gpu_smoke.py --validate-only
      - name: Run bounded L4 training and persistence verification
        run: python scripts/modal_gpu_smoke.py
      - name: Confirm this run has stopped and has zero tasks
        if: always()
        run: python scripts/modal_gpu_smoke.py --confirm-stopped
      - name: Preserve JSON evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/runs/gpu-smoke/result.json
          if-no-files-found: warn
          retention-days: 30
