name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  PYTHONUTF8: "1"
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_scope.py
  test:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep complete tag/commit verification on Linux; other platforms need only current code.
          fetch-depth: ${{ runner.os == 'Linux' && '0' || '1' }}
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-model.txt
            requirements-test.txt
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python scripts/validate_preparation.py
      - run: python scripts/validate_lessons.py
      - run: python scripts/validate_curriculum_evidence.py
      - name: Check immutable lesson releases with complete Linux history
        if: runner.os == 'Linux'
        run: python scripts/verify_release.py pins
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: zensical build --clean --strict
      - run: python scripts/validate_site.py
