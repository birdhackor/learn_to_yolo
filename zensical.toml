[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "zh-TW"
font = false
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "切換深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "切換淺色模式"

[project.markdown_extensions]
admonition = {}
attr_list = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.arithmatex" = { generic = true }
"pymdownx.highlight" = { pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
toc = { permalink = true }
