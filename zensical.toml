# Website configuration. Lesson code and Colab retain their frozen release tag.
[project]
site_name = "Learn to YOLO"
site_description = "從小型 CNN、ResNet 到 YOLO 演化的中文 PyTorch 教材，52 節圖文與獨立 Colab，另有 ViT／DINO 支線。"
site_url = "https://birdhackor.github.io/learn_to_yolo/"
repo_url = "https://github.com/birdhackor/learn_to_yolo"
repo_name = "birdhackor/learn_to_yolo"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true

extra_javascript = [
  "assets/javascripts/mathjax.js",
  "assets/vendor/mathjax/es5/tex-mml-chtml.js",
]
extra_css = ["assets/stylesheets/extra.css"]

